# The weekly drift pass: once a week and a bigger job, never a merge gate. Each week it opens (or reopens) the one
# drift-pass issue, labelled `build`, with the range of merges since the last pass, and hands it to claude-build.yml,
# which builds it like any issue: a tidy over the week's merges, and the docs brought up to what merged.
# It dispatches rather than relying on the `build` label: a label added with the default token starts no workflow.
# Nothing runs on the schedule until the repository variable PIPELINE_ON is `true`, and a pass stops green, saying
# which, if BUILD_TOKEN or the model secret is missing (docs/PIPELINE.md).
name: drift-pass

on:
  schedule:
    - cron: "0 1 * * 1"  # Mondays 01:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  DRIFT_LABEL: drift-pass  # finds the one issue, open or closed
  TITLE: "Weekly drift pass"
  PASS_MARK: "^refactor: drift pass"  # how a drift pass's pull request title starts
  REFACTOR_SKILL: .claude/skills/refactor/SKILL.md
  # a step's `if` cannot read secrets, so these carry whether each is set
  HAS_BUILD_TOKEN: ${{ secrets.BUILD_TOKEN != '' }}
  HAS_MODEL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}

jobs:
  open:
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINE_ON == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: setup
        name: Is setup finished?
        run: |
          go=true
          [ "$HAS_BUILD_TOKEN" = true ] || { go=false; echo "::notice::No BUILD_TOKEN secret: the build has no account to run as, so no drift pass starts (docs/PIPELINE.md)."; }
          [ "$HAS_MODEL" = true ] || { go=false; echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN secret (and no ANTHROPIC_API_KEY): the build has no model, so no drift pass starts (docs/PIPELINE.md)."; }
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: steps.setup.outputs.go == 'true'
        with:
          fetch-depth: 0  # the range runs back to the last drift pass
      - name: Open or reopen the drift-pass issue and start its build
        if: steps.setup.outputs.go == 'true'
        env:
          # as the lead: a build started as the pipeline's own account wakes the lead when it ends
          DISPATCH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          last=$(git log -1 --format=%h --grep="$PASS_MARK" origin/main)
          range="${last:+$last..}origin/main"
          count=$(git rev-list --count "$range")
          if [ "$count" = 0 ]; then echo "Nothing merged since the last drift pass ($last)."; exit 0; fi
          if [ -n "$(gh pr list --state open --search "\"refactor: drift pass\" in:title" --json number --jq '.[].number')" ]; then
            echo "::notice::A drift pass's pull request is still open: no new pass this week."; exit 0
          fi
          if [ -f "$REFACTOR_SKILL" ]; then checklist="The /refactor checklist ($REFACTOR_SKILL) across the range"
          else checklist="A tidy across the range (anything written twice, names that don't match their neighbours, docs that disagree)"; fi
          merges=$(git log --format='- %s' "$range" | head -60)
          body=$(cat <<EOF
          The weekly drift pass: once a week, a bigger job. Range: \`${last:-the start}..main\`, $count merged.

          Do, over that range:
          1. $checklist: \`git diff --stat ${last:+$last..}origin/main\`.
          2. For each new home the range adds (a helper, hook, script, doc), search the whole repo for an older twin.
          3. The docs that describe the repo (README.md, docs/decisions.md, and SPEC.md and ARCHITECTURE.md where they exist) brought up to what merged in the range. Never change a decision of Craig's: fix only where a doc and what merged disagree.

          Fixes go on a \`refactor/\` branch; the pull request title starts \`refactor: drift pass\`. Never change scoring or saved data here.

          Merged since the last pass:
          $merges
          EOF
          )
          gh label create "$DRIFT_LABEL" --color 5319E7 --description 'The weekly drift pass' --force
          gh label create build --color 1D76DB --description 'Build this issue' --force
          issue=$(gh issue list --state all --label "$DRIFT_LABEL" --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            url=$(gh issue create --title "$TITLE" --label "$DRIFT_LABEL" --label build --body "$body")
            issue=${url##*/}
          else
            gh issue reopen "$issue" 2>/dev/null || true  # already open is fine
            gh issue edit "$issue" --title "$TITLE" --body "$body" --add-label build
          fi
          GH_TOKEN="$DISPATCH_TOKEN" gh workflow run claude-build.yml --ref "$GITHUB_REF_NAME" -f issue="$issue"
          echo "::notice::Drift pass #$issue started over $range ($count merged)."
