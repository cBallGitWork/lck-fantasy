<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Coach card</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap");
:root { --ink: #1d1d1d; --mid: #6b6b6b; --soft: #9a9a9a; --line: #cfcfcf; --fill: #ececec; --bg: #f7f7f5; --paper: #fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1440px; min-height: 1000px; background: var(--bg); color: var(--ink); font: 14px/1.4 "IBM Plex Sans KR", sans-serif; position: relative; }
iframe.under { position: absolute; inset: 0; width: 1440px; height: 1000px; border: 0; }
.dim { position: absolute; inset: 0; background: rgba(29,29,29,.55); }
.ph { background: repeating-linear-gradient(45deg, var(--fill), var(--fill) 6px, #e2e2e2 6px, #e2e2e2 12px); border: 1px dashed var(--soft); color: var(--mid); display: flex; align-items: center; justify-content: center; font-size: 11px; }
.tag { display: inline-block; border: 1px solid var(--ink); padding: 0 5px; font-size: 11px; font-weight: 600; line-height: 16px; color: var(--ink); }

/* type scale: 40 name · 48 mono hero · 20 mono tier-2 · 14 body · 12 labels */
.card { position: absolute; left: 220px; top: 44px; width: 1000px; background: var(--paper); border: 1px solid var(--ink); }
.x { position: absolute; right: 18px; top: 10px; font-size: 16px; color: var(--mid); z-index: 1; }
.x.on-bar { color: #fff; top: 7px; }
.news { background: var(--ink); color: #fff; padding: 7px 24px; font-size: 13px; }

/* band 1: the lower-third */
.lt { display: grid; grid-template-columns: 80px 1fr auto; gap: 20px; padding: 28px 24px 16px; align-items: end; }
.por { width: 80px; height: 80px; }
.who .chip { display: inline-block; background: var(--ink); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; margin-bottom: 6px; }
.who h1 { font-size: 40px; letter-spacing: -1px; line-height: 1; display: flex; align-items: baseline; gap: 12px; }
.who h1 i { font-style: normal; font-size: 40px; font-weight: 500; color: var(--mid); letter-spacing: 0; }
.who .legal { font-size: 12px; color: var(--mid); margin-top: 6px; }
.hero { text-align: right; padding-right: 28px; }
.hero b { font: 600 48px "IBM Plex Mono", monospace; line-height: 1; display: block; }
.hero span { font-size: 12px; color: var(--mid); font-weight: 500; }

/* band 2: meta + actions */
.meta { display: flex; align-items: center; gap: 24px; padding: 0 24px 16px; border-bottom: 1px solid var(--line); }
.meta .kv { font-size: 13px; color: var(--mid); } .meta .kv b { font: 600 20px "IBM Plex Mono", monospace; color: var(--ink); margin-right: 6px; }
.side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 14px; align-self: stretch; }
.lt { min-height: 132px; }
.acts { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.acts span { height: 32px; display: inline-flex; align-items: center; padding: 0 12px; border: 1px solid var(--line); font-size: 13px; }
.acts span.on { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
.acts a { font-size: 13px; text-decoration: underline; margin-left: 8px; }

/* body: left (weeks, tabs, content) + right rail (season) */
.body { display: grid; grid-template-columns: 1fr 300px; }
.left { padding: 0 24px 24px; } #main { min-height: 400px; }
.rail { border-left: 1px solid var(--line); padding: 16px 24px 24px; }

.weeks { display: grid; grid-template-columns: repeat(3, 1fr) 2px repeat(3, 1fr); padding: 14px 0; border-bottom: 1px solid var(--line); }
.weeks .c { padding: 0 10px; }
.weeks .w { font-size: 12px; color: var(--mid); font-weight: 500; display: block; }
.weeks b { font: 600 20px "IBM Plex Mono", monospace; display: block; line-height: 1.2; }
.weeks .o { font-size: 12px; color: var(--mid); }
.weeks .n .o { color: var(--mid); font: 400 20px "IBM Plex Mono", monospace; display: block; line-height: 1.2; }
.weeks .n.first .o { color: var(--ink); font-weight: 600; }
.weeks .now { background: var(--ink); }

.tabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs span { padding: 12px 0 10px; margin-right: 26px; color: var(--mid); } .tabs span.on { color: var(--ink); font-weight: 700; border-bottom: 2px solid var(--ink); margin-bottom: -1px; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
#main table.g { table-layout: fixed; } #main table.g td:nth-child(1) { width: 50px; } #main table.g td:nth-child(3) { width: 140px; } #main table.g td:nth-child(4) { width: 60px; }
th { text-align: right; font-weight: 500; color: var(--mid); font-size: 12px; padding: 0 6px 6px; }
td { text-align: right; padding: 0 6px; height: 36px; border-top: 1px solid var(--fill); }
th.l, td.l { text-align: left; }
td.n { font-family: "IBM Plex Mono", monospace; }
td.p { font: 600 14px "IBM Plex Mono", monospace; }
tr.drop td.p { color: var(--soft); font-weight: 400; text-decoration: line-through; }
.res { color: var(--soft); }
tr.tot td { border-top: 2px solid var(--ink); font-weight: 600; height: 48px; } tr.tot td.p { font-size: 20px; }
tr.wk1 td { border-top: 1px solid var(--line); }
.g2 { color: var(--mid); }
h4 { font-size: 12px; font-weight: 600; letter-spacing: .04em; border-top: 2px solid var(--ink); padding-top: 8px; margin: 24px 0 6px; display: flex; justify-content: space-between; align-items: baseline; }
h4 b { font: 600 14px "IBM Plex Mono", monospace; letter-spacing: 0; }
#main table.h { table-layout: fixed; } col.c1 { width: 70px; } col.c3 { width: 70px; } col.c4 { width: 120px; } col.c5 { width: 90px; } col.c6 { width: 60px; } col.c7 { width: 70px; }
#main table.ch { width: 420px; }
h4:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
h4 span { font-weight: 400; color: var(--mid); font-size: 12px; }

.rail .tot { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--ink); padding-bottom: 8px; margin-bottom: 4px; }
.rail .tot span { font-size: 14px; font-weight: 600; } .rail .tot i { font-style: normal; font-size: 12px; color: var(--mid); }
.rail table td { height: 36px; font-size: 13px; }
.rail td.pg { color: var(--soft); font-family: "IBM Plex Mono", monospace; }
#main table.k td:nth-child(1) { width: 50px; } #main table.k td:nth-child(2) { width: 40px; } #main table.k td:nth-child(4) { width: 60px; }
</style></head>
<body>
<iframe class="under" id="under"></iframe><div class="dim"></div>
<div class="card">
  <span class="x">✕</span>
  <div id="news"></div>
  <div class="lt"><div class="por ph">team crest</div>
    <div class="who"><span class="chip">Coach · T1</span><h1>kkOma<i>김정균</i></h1><div class="legal">Kim Jeong-gyun · head coach</div></div>
    <div class="side"><div class="hero" id="hero"></div><div class="acts" id="acts"></div></div></div>
  <div class="meta" id="meta"></div>
  <div class="body"><div class="left"><div class="weeks" id="weeks"></div><div class="tabs" id="tabs"></div><div id="main"></div></div>
    <div class="rail" id="rail"></div></div>
</div>
<script>
// The coach card: the player card with the coach's lines (spec/12 The coach card, spec/05 The coach).
// Made-up LCK Cup data, the same moments as the Pick Team and Points pictures. The coach is the team: T1.
// ?v=history (default): from Pick Team, Week 4, Tuesday, before the deadline.
// ?v=week: from Points, Week 3 Saturday, T1 v DK game 2 live.
// ?v=roster: the Roster tab, from Pick Team.
// A series scores the best 2 games, +3 a series won, −1 a series lost. Week totals 6, 8, 13; form 9.0 as Pick Team.
const V = new URLSearchParams(location.search).get("v") || "history";
const FP = V === "week";
document.getElementById("under").src = FP ? "../points/points.html" : "../pick-team/pick.html";
const $ = (id) => document.getElementById(id);

$("hero").innerHTML = `<b>${FP ? 14 : 27}</b><span>Season · ${FP ? "3rd" : "1st"} of 10 coaches</span>`;

// No Carry, Vice-carry or swap: the coach is never Carry and has no bench (spec/01, spec/04).
const acts = FP ? `<a>Compare ›</a>` : `<span>Transfer out</span><a>Compare ›</a>`;
$("meta").innerHTML = `<span class="kv"><b>7.0억</b>▲0.5</span><span class="kv"><b>${FP ? "7.0" : "9.0"}</b>form · ${FP ? "2nd" : "1st"}</span>
  <span class="kv"><b>22%</b>owned · 2nd</span><span class="kv">${FP ? "+204 / −58" : "+310 / −95"} this week</span>`;
$("acts").innerHTML = acts;

const PAST = FP
  ? [["W2 · Fri", "v BFX", "4"], ["W3 · Wed", "v HLE", "8"], ["W3 · Sat", "v DK", "2 ●"]]
  : [["W2 · Fri", "v BFX", "4"], ["W3 · Wed", "v HLE", "8"], ["W3 · Sat", "v DK", "5"]];
const NEXT = [["W4 · Wed · Bo3", "v KT"], ["W4 · Sat · Bo3", "v GEN"], ["W5 · Thu · Bo3", "v BRO"]];
$("weeks").innerHTML = PAST.map(([w, o, p]) => `<div class="c"><span class="w">${w}</span><b>${p}</b><span class="o">${o}</span></div>`).join("")
  + `<div class="now"></div>` + NEXT.map(([w, o], i) => `<div class="c n ${i === 0 ? "first" : ""}"><span class="w">${w}</span><span class="o">${o}</span></div>`).join("");

// Roster replaces Champions (spec/12 The coach card).
const TABS = ["This week", "Fixtures", "History", "Roster"];
const ON = { week: "This week", roster: "Roster" }[V] || "History";
$("tabs").innerHTML = TABS.map((t) => `<span class="${t === ON ? "on" : ""}">${t}</span>`).join("");

// This week: each game, the lines it scored, points; the best 2 count; then the series result (spec/05).
const G = (n, res, lines, p, keep, live) => `<tr class="${keep ? "" : "drop"}"><td class="l g2">G${n}</td><td class="l">${res ? `<span class=res>${res}</span>` : ""}</td><td class="l g2">${lines}</td><td class="p">${p}${live ? " ●" : ""}</td></tr>`;
const S = (label, p) => `<tr><td class="l g2" colspan="3">${label}</td><td class="p">${p}</td></tr>`;
const WEEK = `<h4><span style="color:var(--ink);font-size:12px">Wed · v HLE &nbsp;<span class="g2" style="font-weight:400">W 2–1 · final</span></span><b>8</b></h4><table class="k">
  ${G(1, "W", "First tower · Most drakes", 2, true)}${G(2, "L", "–", 0, false)}${G(3, "W", "First tower · Most drakes · Most barons", 3, true)}${S("Series won", "+3")}</table>
  <h4><span style="color:var(--ink);font-size:12px">Sat · v DK &nbsp;<span class="g2" style="font-weight:400">1–0 · <span class="tag">G2 live</span></span></span><b>2 ●</b></h4><table class="k">
  ${G(1, "W", "First tower · Most drakes", 2, true)}${G(2, "", "14:20", 0, true, true)}${S("Series · +3 if won, −1 if lost", "–")}
  <tr class="tot"><td class="l" colspan="3">Week 3</td><td class="p">10</td></tr></table>`;

// History: each series' points; the week's price and total once (spec/12). No K/D/A for a team.
const SR = [[3, "Sat", "W 2–0 DK", 2, "7.0억", 5], [3, "Wed", "W 2–1 HLE", 3, "7.0억", 8],
  [2, "Fri", "W 2–1 BFX", 3, "6.5억", 4], [2, "Wed", "W 2–0 DNS", 2, "6.5억", 4],
  [1, "Sat", "W 2–0 NS", 2, "6.5억", 6], [1, "Wed", "L 1–2 GEN", 3, "6.5억", 0]];
const WPTS = SR.reduce((m, x) => ({ ...m, [x[0]]: (m[x[0]] || 0) + x[5] }), {});
const COLS = `<colgroup><col class="c1"><col><col class="c3"><col class="c5"><col class="c6"><col class="c7"></colgroup>`;
const HIST = `<h4>LCK Cup 2027</h4><table class="h">${COLS}<tr><th class="l">Week</th><th class="l">Series</th><th>Games</th><th>Price</th><th>Pts</th><th>Week</th></tr>
  ${SR.map(([w, d, r, g, pr, p], i) => { const same = i > 0 && SR[i - 1][0] === w; return `<tr${i > 0 && !same ? ' class="wk1"' : ""}><td class="l g2">${same ? "" : w}</td><td class="l">${d} · ${r}</td><td class="n">${g}</td><td class="n g2">${same ? "" : pr}</td><td class="p">${p}</td><td class="p">${same ? "" : WPTS[w]}</td></tr>`; }).join("")}</table>
  <h4>Past seasons <span>T1, scored by Flol</span></h4><table class="h">${COLS}<tr><th class="l">Season</th><th></th><th>Games</th><th>Per game</th><th>Pts</th><th></th></tr>
  <tr><td class="l" colspan="2">LCK 2026</td><td class="n">98</td><td class="n g2">2.9</td><td class="p">284</td><td></td></tr>
  <tr><td class="l" colspan="2">LCK 2025</td><td class="n">104</td><td class="n g2">3.1</td><td class="p">322</td><td></td></tr></table>`;

// Roster: the team's players and prices (spec/12 The coach card). Faker's numbers match his card.
const RO = [["Top", "Doran", "12.5억", 38, "12%"], ["Jungle", "Oner", "14.0억", 44, "21%"], ["Mid", "Faker", "18.5억", 58, "46%"], ["Bot", "Peyz", "15.0억", 47, "30%"], ["Support", "Keria", "14.5억", 41, "25%"]];
const ROSTER = `<table class="ch" style="width:560px"><tr><th class="l">Role</th><th class="l">Player</th><th>Price</th><th>Season</th><th>Owned</th></tr>
  ${RO.map(([r, n, pr, p, o]) => `<tr><td class="l g2">${r}</td><td class="l">${n}${n === "Faker" ? ` <span class="tag">in your team</span>` : ""}</td><td class="n">${pr}</td><td class="p">${p}</td><td class="n g2">${o}</td></tr>`).join("")}</table>`;

$("main").innerHTML = { week: WEEK, roster: ROSTER }[V] || HIST;

// Season: the coach's lines (spec/05). Total over every game; Pts only the counted games, plus the series points.
const LINES = FP
  ? [["First tower", 5, 3], ["Most drakes", 3, 2], ["Most barons", 1, 1], ["Most elders", 0, 0], ["Quick win", 0, 0], ["Series won", 3, 9], ["Series lost", 1, -1]]
  : [["First tower", 8, 6], ["Most drakes", 7, 5], ["Most barons", 3, 2], ["Most elders", 1, 0], ["Quick win", 0, 0], ["Series won", 5, 15], ["Series lost", 1, -1]];
const GAMES = FP ? 10 : 15;
const SERIESROW = (l) => l.startsWith("Series");
$("rail").innerHTML = `<div class="tot"><span>Season</span><i>${GAMES} games</i></div><table><tr><th class="l"></th><th>Total</th><th>Per game</th><th>Pts</th></tr>
  ${LINES.map(([l, t, p]) => `<tr><td class="l">${l}</td><td class="n">${t}</td><td class="pg">${SERIESROW(l) ? "" : (t / GAMES).toFixed(1)}</td><td class="p">${p > 0 ? "+" + p : p}</td></tr>`).join("")}</table>`;
</script>
</body></html>
