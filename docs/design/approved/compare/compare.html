<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Compare</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap");
:root { --ink: #1d1d1d; --mid: #6b6b6b; --soft: #9a9a9a; --line: #cfcfcf; --fill: #ececec; --bg: #f7f7f5; --paper: #fff; --rise: #c8102e; --fall: #1f4fa8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1440px; min-height: 1000px; background: var(--bg); color: var(--ink); font: 14px/1.4 "IBM Plex Sans KR", sans-serif; position: relative; }
iframe.under { position: absolute; inset: 0; width: 1440px; height: 1000px; border: 0; }
.dim { position: absolute; inset: 0; background: rgba(29,29,29,.55); }
.ph { background: var(--paper); border: 1px dashed var(--soft); color: var(--mid); display: flex; align-items: center; justify-content: center; font-size: 12px; }
.mono { font-family: "IBM Plex Mono", monospace; }

/* drawn to docs/design/plate.md, as the player card: 28 names and Season · 20 mono figures · 16 hangul · 14 body · 12 labels */
.sheet { position: absolute; left: 192px; top: 32px; width: 1056px; background: var(--paper); border: 1px solid var(--ink); }
.x { position: absolute; right: 12px; top: 8px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--ink); }
a { color: var(--ink); min-height: 24px; display: inline-flex; align-items: center; }

/* the two lower-thirds, facing each other as the broadcast's head-to-head */
.vs { display: grid; grid-template-columns: 1fr 72px 1fr; align-items: end; padding: 48px 24px 16px; border-bottom: 1px solid var(--line); }
.lt { display: flex; gap: 16px; align-items: flex-end; } .lt.r { flex-direction: row-reverse; text-align: right; }
.por { width: 72px; height: 72px; flex: none; }
.tag { display: inline-block; border: 1px solid var(--ink); padding: 0 4px; font-size: 11px; font-weight: 600; line-height: 16px; color: var(--ink); margin-bottom: 8px; } .up { color: var(--rise); }
.lt h1 { font-size: 28px; font-weight: 700; line-height: 1.2; display: flex; align-items: baseline; gap: 8px; } .lt.r h1 { justify-content: flex-end; }
.lt h1 i { font-style: normal; font-size: 16px; font-weight: 400; color: var(--mid); }
.lt .legal { font-size: 14px; color: var(--mid); margin-top: 4px; } .lt .legal a { color: var(--ink); }
.vs .v { text-align: center; font: 600 20px "IBM Plex Mono", monospace; color: var(--mid); padding-bottom: 16px; }

/* one mirrored table: Faker's side, the line in the middle, Chovy's side */
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.wrap { padding: 0 24px 24px; }
th { font-size: 12px; font-weight: 600; color: var(--mid); padding: 8px 8px 8px; }
td { height: 40px; padding: 0 8px; border-top: 1px solid var(--fill); font: 14px "IBM Plex Mono", monospace; color: var(--ink); }
td.lab { text-align: center; font: 400 14px "IBM Plex Sans KR"; color: var(--ink); background: var(--bg); }
.L { text-align: right; } .R { text-align: left; }
td.b { font-weight: 700; }
td small { font: 12px "IBM Plex Sans KR"; color: var(--mid); margin: 0 8px; }
tr.big td { height: 64px; font-size: 28px; } tr.big td.lab { font-size: 14px; }
/* series strips, as the card's front */
.strip { display: flex; } .L .strip { justify-content: flex-end; }
.strip span { display: inline-flex; flex-direction: column; min-width: 72px; padding: 0 8px; text-align: center; font: 12px "IBM Plex Sans KR"; color: var(--mid); }
.strip span b { font: 600 20px "IBM Plex Mono", monospace; color: var(--ink); line-height: 1.2; }
.strip span em { font: 400 14px "IBM Plex Sans KR"; color: var(--mid); font-style: normal; line-height: 1.6; }
.strip span.first em { color: var(--ink); font-weight: 700; }
tr.str td { height: 60px; }
.find { border: 1px solid var(--ink); height: 40px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; color: var(--mid); margin-bottom: 8px; }
.pick td { height: 40px; } .pick td.nm { font: 600 14px "IBM Plex Sans KR"; } .pick td.tm { font: 12px "IBM Plex Sans KR"; color: var(--mid); } .pick .hd { font: 600 12px "IBM Plex Sans KR"; color: var(--mid); padding: 12px 0 4px; } .pick .more { font: 600 14px "IBM Plex Sans KR"; display: flex; margin-top: 12px; }
</style></head>
<body>
<iframe class="under" id="under"></iframe><div class="dim"></div>
<div class="sheet">
  <span class="x">✕</span>
  
  <div class="vs" id="vs"></div>
  <div class="wrap" id="wrap"></div>
</div>
<script>
// Opened from Compare › on a card, from Pick Team: LCK Cup Week 4, Tuesday 22:00 London, Weeks 1 to 3 final.
// ?v=players (default): Faker v Chovy. ?v=pick: the second player not picked yet. ?v=coaches: kkOma v Ryu.
// The left side is the card's; the right side's numbers are the Stats and Transfers pictures'.
// Form is points ÷ 3 until Week 4 is final, so Chovy's 61 gives 20.3 (1st) and Faker's 58 gives 19.3 (2nd).
const V = new URLSearchParams(location.search).get("v") || "players";
const $ = (id) => document.getElementById(id);
const P = {
  Faker: { chip: "Mid · T1", hangul: "이상혁", legal: "Lee Sang-hyeok", of: "mids", games: 15,
    season: [58, "2nd"], form: ["19.3", "2nd"], price: "18.5억 ▲0.5", owned: ["46%", "1st"], tx: "+1,204 / −310",
    last: [["W2 · Fri", "BFX", 10], ["W3 · Wed", "HLE", 12], ["W3 · Sat", "DK", 10]], next: [["W4 · Wed", "KT"], ["W4 · Sat", "GEN"], ["W5 · Thu", "BRO"]],
    lines: [["Kills", 73, 22], ["Assists", 86, 16], ["Deaths", 26, -4], ["Gold lead at 15", 9, 9], ["Solo kills", 5, 5], ["First bloods", 3, 3], ["Deathless", 4, 4], ["Quadra kills", 1, 1], ["Steals", 2, 2]] },
  Chovy: { chip: "Mid · GEN", hangul: "정지훈", legal: "Jeong Ji-hoon", of: "mids", games: 16,
    season: [61, "1st"], form: ["20.3", "1st"], price: "17.5억 ▲0.5", owned: ["41%", "2nd"], tx: "+980 / −402",
    last: [["W2 · Sat", "BRO", 11], ["W3 · Wed", "KT", 9], ["W3 · Sat", "HLE", 8]], next: [["W4 · Thu", "BRO"], ["W4 · Sat", "T1"], ["W5 · Wed", "DNS"]],
    lines: [["Kills", 70, 24], ["Assists", 74, 12], ["Deaths", 9, -2], ["Gold lead at 15", 11, 11], ["Solo kills", 8, 8], ["First bloods", 3, 3], ["Deathless", 4, 4], ["Quadra kills", 1, 1], ["Steals", 0, 0]] },
  // Coaches: the coach card's kkOma; Ryu from Stats (26 = 5 series won × 3 − 1 lost + 12 from the lines).
  kkOma: { chip: "Coach · T1", hangul: "김정균", legal: "Kim Jeong-gyun", of: "coaches", games: 15, coach: true,
    season: [27, "1st"], form: ["9.0", "1st"], price: "7.0억 ▲0.5", owned: ["22%", "1st"], tx: "+310 / −95",
    last: [["W2 · Fri", "BFX", 4], ["W3 · Wed", "HLE", 8], ["W3 · Sat", "DK", 8]], next: [["W4 · Wed", "KT"], ["W4 · Sat", "GEN"], ["W5 · Thu", "BRO"]],
    lines: [["First tower", 8, 6], ["Most drakes", 7, 5], ["Most barons", 3, 2], ["Most elders", 1, 0], ["Quick win", 0, 0], ["Series won", 5, 15], ["Series lost", 1, -1]] },
  Ryu: { chip: "Coach · GEN", hangul: "류상욱", legal: "Ryu Sang-wook", of: "coaches", games: 16, coach: true,
    season: [26, "2nd"], form: ["8.7", "2nd"], price: "7.0억", owned: ["21%", "2nd"], tx: "+188 / −120",
    last: [["W2 · Sat", "BRO", 5], ["W3 · Wed", "KT", 6], ["W3 · Sat", "HLE", 9]], next: [["W4 · Thu", "BRO"], ["W4 · Sat", "T1"], ["W5 · Wed", "DNS"]],
    lines: [["First tower", 7, 5], ["Most drakes", 6, 4], ["Most barons", 4, 3], ["Most elders", 0, 0], ["Quick win", 1, 0], ["Series won", 5, 15], ["Series lost", 1, -1]] },
};
const [A, B] = V === "coaches" ? ["kkOma", "Ryu"] : ["Faker", "Chovy"];
$("under").src = V === "coaches" ? "../coach-card/coach.html" : "../player-card/card.html";
const a = P[A], b = V === "pick" ? null : P[B];

const lt = (n, p, right) => `<div class="lt ${right ? "r" : ""}"><div class="por ph">portrait</div><div><span class="tag">${p.chip}</span><h1>${n}<i>${p.hangul}</i></h1>${right ? '<div class="legal"><a>Change ›</a></div>' : ""}</div></div>`;
$("vs").innerHTML = lt(A, a) + `<div class="v">v</div>` + (b ? lt(B, b, true) : `<div></div>`);

// Higher is better for season, form and every line's points; price, owned and transfers are not marked.
const better = (x, y) => (x === y ? "" : x > y ? "L" : "R");
const up = (s) => s.replace(/▲[\d.]+/, (m) => `<span class="up">${m}</span>`);
const cell = (v, r) => `${v}<small>${r}</small>`;
const row = (lab, f, c, mark, cls = "") => `<tr class="${cls}"><td class="L ${mark === "L" ? "b" : ""}">${f}</td><td class="lab">${lab}</td><td class="R ${mark === "R" ? "b" : ""}">${c}</td></tr>`;
const strip = (xs, past) => `<div class="strip">${xs.map(([w, o, p], i) => `<span class="${!past && i === 0 ? "first" : ""}">${w}${past ? `<b>${p}</b>v ${o}` : `<em>v ${o}</em>`}</span>`).join("")}</div>`;
const col3 = `<colgroup><col><col style="width:160px"><col></colgroup>`;
const pg = (t, g) => (t / g).toFixed(1), sgn = (p) => (p > 0 ? "+" + p : p);

if (!b) {
  // The second player not picked yet: a search, his role listed first (spec/12 Compare). Mids from the Stats picture.
  const MIDS = [["Chovy", "GEN", "17.5억", 61], ["Zeka", "HLE", "15.0억", 41], ["BuLLDoG", "DNS", "11.0억", 36], ["ShowMaker", "DK", "13.0억", 33]];
  $("wrap").innerHTML = `<div style="margin-top:24px">
    <div class="pick"><div class="find">Find a player</div><div class="hd">Mids</div><table><colgroup><col><col style="width:70px"><col style="width:80px"><col style="width:60px"></colgroup>
      ${MIDS.map(([n, t, pr, pt]) => `<tr><td class="nm">${n}</td><td class="tm">${t}</td><td class="R">${pr}</td><td class="R" style="text-align:right;font-weight:600">${pt}</td></tr>`).join("")}</table>
      <a class="more">All mids · Other roles ›</a></div></div>`;
} else {
  const head = `<table style="margin-top:12px">${col3}
    ${row("Season", cell(a.season[0], a.season[1] + " of 10 " + a.of), cell(b.season[0], b.season[1] + " of 10 " + b.of), better(a.season[0], b.season[0]), "big")}
    ${row("Form", a.form[0], b.form[0], better(+a.form[0], +b.form[0]))}
    ${row("Price", up(a.price), up(b.price), "")}${row("Owned", a.owned[0], b.owned[0], "")}
    <tr class="str"><td class="L">${strip(a.last, true)}</td><td class="lab">Last 3</td><td class="R">${strip(b.last, true)}</td></tr>
    <tr class="str"><td class="L">${strip(a.next)}</td><td class="lab">Next 3</td><td class="R">${strip(b.next)}</td></tr></table>`;
  // Each side: total, per game, points, mirrored so the points sit next to the line. The better points are bold.
  const lr = (i) => { const [l, ft, fp] = a.lines[i], [, ct, cp] = b.lines[i], m = better(fp, cp), ser = l.startsWith("Series");
    return `<tr><td class="L">${ft}</td><td class="L">${ser ? "" : pg(ft, a.games)}</td><td class="L pts ${m === "L" ? "b" : ""}">${sgn(fp)}</td><td class="lab">${l}</td>
      <td class="R pts ${m === "R" ? "b" : ""}">${sgn(cp)}</td><td class="R">${ser ? "" : pg(ct, b.games)}</td><td class="R">${ct}</td></tr>`; };
  const lines = `<table style="margin-top:24px;border-top:2px solid var(--ink)">
    <colgroup><col><col style="width:110px"><col style="width:90px"><col style="width:160px"><col style="width:90px"><col style="width:110px"><col></colgroup>
    <tr><th class="L">Total</th><th class="L">Per game</th><th class="L">Pts</th><th></th><th class="R">Pts</th><th class="R">Per game</th><th class="R">Total</th></tr>
    ${a.lines.map((_, i) => lr(i)).join("")}</table>`;
  $("wrap").innerHTML = head + lines;
  const tot = (p) => p.lines.reduce((s, x) => s + x[2], 0);
  console.assert(tot(a) === a.season[0] && tot(b) === b.season[0], "season points");
}
</script>
</body></html>
