<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Crests</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@600;700&display=swap");
:root { --bg:#010A13; --paper:#0A1428; --line:#1E2D40; --ink:#C89B3C; --text:#F0E6D2; --mid:#A09B8C; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1440px; background: var(--bg); color: var(--text); font: 14px/1.4 "IBM Plex Sans KR", sans-serif; padding: 24px 32px 48px; }
h1 { font-size: 28px; font-weight: 700; } h1 i { font-style: normal; color: var(--mid); font-size: 16px; font-weight: 400; margin-left: 8px; }
section { border-top: 2px solid var(--ink); padding-top: 8px; margin-top: 24px; }
h2 { font-size: 14px; font-weight: 700; display: flex; gap: 12px; align-items: baseline; margin-bottom: 16px; } h2 span { font-weight: 400; color: var(--mid); font-size: 12px; }
.row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 16px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.cell b { font-size: 12px; font-weight: 600; } .cell span { font-size: 12px; color: var(--mid); }
.sizes { display: flex; gap: 24px; align-items: center; margin-top: 16px; color: var(--mid); font-size: 12px; }
.badges { display: grid; grid-template-columns: repeat(3, 160px) 1fr; gap: 24px; align-items: start; }
.pc { background: var(--paper); border: 1px solid var(--ink); }
.pc .rl { height: 48px; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-bottom: 1px solid var(--line); font-size: 12px; }
.por { position: relative; height: 176px; margin: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.pc .nm { font-size: 20px; font-weight: 700; padding: 0 8px; } .pc .tm { font-size: 12px; color: var(--mid); padding: 0 8px 8px; }
.mk { position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); font-weight: 700; display: flex; align-items: center; justify-content: center; }
table { border-collapse: collapse; background: var(--paper); width: 520px; }
td, th { height: 40px; padding: 0 12px; border-bottom: 1px solid var(--line); text-align: left; } th { font-size: 12px; color: var(--mid); font-weight: 400; }
td.n { text-align: right; font-family: "IBM Plex Mono", monospace; }
.who { display: flex; gap: 8px; align-items: center; }
</style></head>
<body>
<h1>Crests<i>엠블럼</i></h1>
<div id="root"></div>
<script>
// Ten teams, colours from docs/research/lck-visual-research.md (Namu Wiki). Our own shapes and marks; no team's emblem copied.
const T = [
  ["T1","T1","#E2012D","#111111"],["GEN","Gen.G","#AA8A00","#111111"],["HLE","Hanwha Life","#F37321","#111111"],
  ["KT","KT Rolster","#FF0A07","#111111"],["DK","Dplus KIA","#111111","#92E1E6"],["NS","Nongshim","#DE2027","#111111"],
  ["BFX","BNK FEARX","#FBE400","#111111"],["DNS","DN SOOPers","#0C50F1","#FFFFFF"],["BRO","Hanjin BRION","#00492B","#D1A722"],["KRX","Kiwoom DRX","#001C58","#FFFFFF"],
];
// Story marks: one small drawing per team, from its story, drawn in a 20 box. f = fill, s = stroke.
const MARK = {
  T1:  { story: "a truck: T1 fans' protest trucks", d: '<path d="M1 4h12v10H1zM13 7h3.5l2.5 3.5V14h-6z" FILL/><rect x="2.5" y="5.5" width="9" height="5" BGFILL/><circle cx="5" cy="16" r="2.4" FILL/><circle cx="15" cy="16" r="2.4" FILL/>' },
  GEN: { story: "tiger stripes: TigerNation", d: '<path d="M2 3h5l-2 14H3zM8 3h4l-1 14H9zM13 3h5l-2 14h-2z" FILL/>' },
  HLE: { story: "a chick: 롤칰, after the Hanwha Eagles", d: '<circle cx="8.5" cy="12.5" r="6" FILL/><circle cx="13.5" cy="6" r="3.8" FILL/><path d="M17 5l3 1.6-3 1.2z" FILL/><circle cx="14.3" cy="5.2" r=".9" BGFILL/>' },
  KT:  { story: "a bolt: the Telecom War with T1", d: '<path d="M12.5 1L3.5 11.5h5.5L7 19l9.5-11H11z" FILL/>' },
  DK:  { story: "a car: 딮붕이, the fans' car", d: '<path d="M1 14v-4l3.5-1.2L7.5 4.5h6l3.5 4.3 2 1.2v4z" FILL/><path d="M8.5 6h2.5v2.8H6.5zM12.5 6h1l2 2.8h-3z" BGFILL/><circle cx="5.5" cy="14.5" r="2.6" FILL BGSTROKE/><circle cx="14.5" cy="14.5" r="2.6" FILL BGSTROKE/>' },
  NS:  { story: "a ramyun bowl: Nongshim", d: '<path d="M1 10h18a9 7 0 0 1-18 0z" FILL/><path d="M6 7c-1-2 1-3 0-5M10 7c-1-2 1-3 0-5M14 7c-1-2 1-3 0-5" STROKE/>' },
  BFX: { story: "a piggy bank: the Bank Derby", d: '<ellipse cx="9.5" cy="10.5" rx="7.5" ry="5.5" FILL/><path d="M4 7.5L4.5 3l3.5 2.5z" FILL/><rect x="16" y="8.5" width="3" height="4" rx="1" FILL/><rect x="4.5" y="14" width="3" height="5" FILL/><rect x="11.5" y="14" width="3" height="5" FILL/><rect x="7.5" y="6.2" width="5" height="1.6" BGFILL/>' },
  DNS: { story: "a bone: the Mad Dogs, 물어!", d: '<path d="M5.5 5.5l9 9" fill="none" STROKEW/><circle cx="3.6" cy="6.4" r="2.6" FILL/><circle cx="6.4" cy="3.6" r="2.6" FILL/><circle cx="13.6" cy="16.4" r="2.6" FILL/><circle cx="16.4" cy="13.6" r="2.6" FILL/>' },
  BRO: { story: "a gift: Morgan's gift penta", d: '<rect x="2.5" y="8.5" width="15" height="10" FILL/><rect x="1" y="5" width="18" height="4" FILL/><rect x="9" y="5" width="2" height="14" BGFILL/><path d="M10 5C7.5 1 3 2.5 5.5 5M10 5c2.5-4 7-2.5 4.5 0" STROKEW2/>' },
  KRX: { story: "a heart: 중꺾마, the heart that never breaks", d: '<path d="M10 18.5L2.6 11A4.6 4.6 0 0 1 10 5a4.6 4.6 0 0 1 7.4 6z" FILL/>' },
};
const lum = (h) => { const n = parseInt(h.slice(1),16), c = [n>>16,(n>>8)&255,n&255].map(v => { v/=255; return v<=.03928?v/12.92:((v+.055)/1.055)**2.4; }); return .2126*c[0]+.7152*c[1]+.0722*c[2]; };
const on = (bg) => lum(bg) > .3 ? "#111111" : "#FFFFFF";
const mark = (code, col, x, y, k, bg = "#0A1428") => `<g transform="translate(${x} ${y}) scale(${k})">${MARK[code].d.replaceAll("BGFILL", `fill="${bg}"`).replaceAll("BGSTROKE", `stroke="${bg}" stroke-width="1.4"`).replaceAll("STROKEW2", `fill="none" stroke="${col}" stroke-width="1.6"`).replaceAll("STROKEW", `stroke="${col}" stroke-width="3.5"`).replaceAll(" FILL", ` fill="${col}"`).replaceAll("STROKE", `fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round"`)}</g>`;
// Under 40 the mark drops and the code alone stays: at table size the shape and field carry the team.
const big = (s) => s >= 40;
const code = (c, fill, s, yBig, ySmall) => {
  if (s < 32) return "";
  const fs = big(s) ? (c.length > 2 ? 14 : 16) : (c.length > 2 ? 17 : 21);
  return `<text x="36" y="${big(s) ? yBig : ySmall}" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="${fs}" fill="${fill}">${c}</text>`;
};
const roundel = ([c,,a,b], s=72) => `<svg width="${s}" height="${s}" viewBox="0 0 72 72"><circle cx="36" cy="36" r="35" fill="${b}"/><circle cx="36" cy="36" r="29" fill="${a}"/><circle cx="36" cy="36" r="25" fill="none" stroke="${b}" stroke-width="1.2" opacity=".6"/>${big(s)?mark(c,on(a),27,15,.9,a):""}${code(c,on(a),s,52,c.length>2?41:43)}</svg>`;
const seal = ([c,,a,b], s=72) => { const rule = b==="#111111"&&a==="#111111" ? "#92E1E6" : b; return `<svg width="${s}" height="${s}" viewBox="0 0 72 72"><rect x="2" y="2" width="68" height="68" fill="${a}"/><rect x="7" y="7" width="58" height="58" fill="none" stroke="${rule}" stroke-width="2.5"/><rect x="7" y="30" width="5" height="12" fill="${a}"/><rect x="60" y="30" width="5" height="12" fill="${a}"/>${big(s)?mark(c,c==="DK"?"#92E1E6":on(a),26,13,1,a):""}${code(c,on(a),s,54,c.length>2?42:44)}</svg>`; };
const shield = ([c,,a,b], s=72) => `<svg width="${s}" height="${s*80/72}" viewBox="0 0 72 80"><defs><clipPath id="k${c}${s}"><path d="M4 4h64v38c0 18-14 30-32 36C18 72 4 60 4 42z"/></clipPath></defs><g clip-path="url(#k${c}${s})"><rect width="72" height="80" fill="${a}"/><path d="M-10 74 L82 44 L82 54 L-10 84z" fill="${b}"/></g><path d="M4 4h64v38c0 18-14 30-32 36C18 72 4 60 4 42z" fill="none" stroke="${b==="#111111"?"#C89B3C":b}" stroke-width="2"/>${big(s)?mark(c,on(a),26,10,1,a):""}${code(c,on(a),s,46,c.length>2?37:39)}</svg>`;
const hex = ([c,,a,b], s=72) => `<svg width="${s}" height="${s}" viewBox="0 0 72 72"><path d="M36 1L67 18.5v35L36 71 5 53.5v-35z" fill="${b}"/><path d="M36 6.5L62 21.5v29L36 65.5 10 50.5v-29z" fill="${a}"/>${big(s)?mark(c,on(a),26,13,1,a):""}${code(c,on(a),s,53,c.length>2?42:44)}</svg>`;
const MIX = { T1: roundel, KT: seal, NS: hex, DNS: roundel, KRX: seal, GEN: seal, DK: seal, HLE: shield, BRO: shield, BFX: hex };
const crest = (t, s) => MIX[t[0]](t, s);
const ROLE = { mid: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M11 1h4v4L5 15H1v-4z" fill="#F0E6D2"/><path d="M1 1h6L4 4v3L1 10zM15 15H9l3-3V9l3-3z" fill="#A09B8C"/></svg>' };
const badge = (t, name) => {
  const [c,,a,b] = t, txt = on(a);
  return `<div class="pc"><div class="rl">${ROLE.mid}<span>Mid</span></div>
   <div class="por" style="background:${a}">
     <svg style="position:absolute;inset:0" width="100%" height="100%"><path d="M0 120 L160 40 L160 70 L0 150z" fill="${b}" opacity=".35"/></svg>
     <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:8px">${crest(t,56)}<span style="font:700 22px 'IBM Plex Sans KR';color:${txt}">${name}</span></div>
     ${name==="Faker"?'<span class="mk">C</span>':""}</div>
   <div class="nm">${name}</div><div class="tm">${c}</div></div>`;
};
const markAlone = (c) => `<svg width="32" height="32" viewBox="0 0 20 20">${mark(c,"#F0E6D2",0,0,1,"#010A13")}</svg>`;
document.getElementById("root").innerHTML =
  `<section><h2>Crests <span>72 · 56 · 40</span></h2><div class="row">${T.map(t => `<div class="cell">${crest(t,72)}<b>${t[0]}</b><span>${t[1]}</span></div>`).join("")}</div>
   <div class="sizes"><span>56</span>${crest(T[0],56)}${crest(T[7],56)}<span>40</span>${crest(T[1],40)}${crest(T[9],40)}<span>24</span>${crest(T[5],24)}${crest(T[3],24)}${crest(T[0],24)}${crest(T[7],24)}${crest(T[9],24)}</div></section>` +
  `<section><h2>Marks <span></span></h2><div class="row">${T.map(t => `<div class="cell">${markAlone(t[0])}<b>${t[0]}</b><span>${MARK[t[0]].story}</span></div>`).join("")}</div></section>` +
  `<section><h2>In use <span></span></h2><div class="badges">
    ${badge(T[0],"Faker")}${badge(T[1],"Chovy")}${badge(T[2],"Zeka")}
    <div><table><tr><th>Player</th><th class="n">Pts</th></tr>
      <tr><td><span class="who">${crest(T[0],24)}<b>Faker</b> T1</span></td><td class="n">40</td></tr>
      <tr><td><span class="who">${crest(T[1],24)}<b>Chovy</b> GEN</span></td><td class="n">15</td></tr>
      <tr><td><span class="who">${crest(T[3],24)}<b>Bdd</b> KT</span></td><td class="n">—</td></tr>
      <tr><td><span class="who">${crest(T[5],24)}<b>Callme</b> NS</span></td><td class="n">9</td></tr></table></div>
  </div></section>`;
</script>
</body></html>
