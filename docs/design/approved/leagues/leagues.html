<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leagues</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../pick-team/base.css">
<link rel="stylesheet" href="../pick-team/look.css">
<style>
/* Leagues in Pick Team's look: the open league's table as the main column, your leagues in the side column (Craig,
   16 Nov 2026). Only what is Leagues' own is here; the rest is ../pick-team/look.css. Panels are Points' and Home's. */
:root { --head-band: #1D46A8; --up: #4CD98A; --down: #FF6B78; }
.num { text-align: right; }
.up { color: var(--up); }
.down { color: var(--down); }
.team__bar { display: inline-block; width: 4px; height: 12px; margin-right: 6px; vertical-align: -1px; }
.who__team { font-weight: 400; }
.shield { margin-right: 6px; vertical-align: -2px; }
.tpanel { background: var(--paper); border: 1px solid var(--line); }
.tpanel__title { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 16px; background: var(--head-band); font: 700 20px/24px var(--head); }
.tpanel__title span { font: 400 14px/24px var(--sans); }
.side .tpanel__title { min-height: 44px; font-size: 16px; }
/* The row under a league's name: its tabs at the left, its own controls at the right. */
.bar2 { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; align-self: stretch; margin-right: auto; }
.tabs span { display: flex; align-items: center; padding: 0 16px; color: var(--mid); border-bottom: 2px solid transparent; }
.tabs .is-here { color: var(--text); font-weight: 600; border-bottom-color: var(--text); }
.code { font: 400 14px/22px var(--fig); border: 1px solid var(--line); padding: 0 8px; }
.key { min-height: 32px; font-size: 14px; }
.key--gold { background: var(--gold); color: var(--on-gold); border-color: var(--gold); font-weight: 700; }
.st th { font: 400 12px/32px var(--sans); color: var(--mid); text-align: left; padding: 0 12px; white-space: nowrap; }
.st th.num { text-align: right; }
.st td { height: var(--row); padding: 0 12px; border-top: 1px solid var(--line); white-space: nowrap; }
.st td:first-child, .st th:first-child { padding-left: 16px; }
.st td small { color: var(--mid); font-size: 12px; margin-left: 8px; }
.st .rk { width: 72px; font: 600 14px/20px var(--fig); }
.st .mv { width: 80px; font: 400 12px/20px var(--fig); }
.st .nil { color: var(--mid); }
.st .tr { width: 136px; }
.st .cy { width: 152px; }
.st .go { width: 40px; text-align: right; padding-right: 16px; }
.st tr.is-me td { background: var(--fill); font-weight: 600; }
.st tr.is-me td small { font-weight: 400; }
.st tr.gap td { height: 24px; text-align: center; color: var(--mid); }
.chase { margin-left: 8px; font-weight: 600; }
.pager { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); }
.pager span { min-width: 32px; padding: 0 8px; font: 400 14px/30px var(--fig); text-align: center; border: 1px solid var(--line); }
.pager .is-here { border-color: var(--text); font-weight: 600; }
.pager .pager__find { font-family: var(--sans); font-weight: 600; border-color: var(--text); }
/* Captains and buffs by tier (spec/08, The Leagues page): a row a tier, yours filled. */
.tiers td { height: var(--row); padding: 0 12px; border-top: 1px solid var(--line); white-space: nowrap; }
.tiers th { font: 400 12px/32px var(--sans); color: var(--mid); text-align: left; padding: 0 12px; }
.tiers td:first-child, .tiers th:first-child { padding-left: 16px; width: 160px; }
.tiers .share { padding-right: 32px; }
.tiers .share b { display: inline-block; width: 40px; text-align: right; font-weight: inherit; }
.sbar { display: inline-block; width: 120px; height: 8px; margin-left: 12px; background: var(--line); }
.sbar i { display: block; height: 100%; }
.tiers .name { width: 152px; }
.bicon { color: var(--gold); margin-right: 8px; vertical-align: -4px; }
.tiers td.share { font-family: var(--fig); }
.tiers tr.is-me td { background: var(--fill); font-weight: 600; }
.tiers tr.is-me td:first-child, .st tr.is-me td:first-child { box-shadow: inset 4px 0 0 var(--text); }
/* The podium: ranks 1 to 3 filled gold, silver, bronze. Your own row: a white left edge. */
.pod { display: inline-block; width: 24px; margin-left: -7px; font: 700 14px/24px var(--fig); text-align: center; color: var(--bg); }
.pod--1 { background: var(--gold); }
.pod--2 { background: #A9B6C6; }
.pod--3 { background: #B0733F; }
.lmark { margin-right: 8px; vertical-align: -4px; }
img.lmark { width: 20px; height: 20px; vertical-align: -5px; }
.lmark--box { display: inline-flex; width: 20px; height: 20px; align-items: center; justify-content: center; vertical-align: -5px; }
.lmark--box .shield { margin: 0; }
.lst__row small { padding-left: 28px; }
.tiers td:last-child, .tiers th:last-child { padding-right: 16px; }
/* The side column: your leagues, the open one marked. */
.lst { display: block; }
.lst__sub { min-height: 28px; padding: 4px 16px; background: var(--fill); font-size: 12px; line-height: 20px; color: var(--mid); }
.lst__row { display: grid; grid-template-columns: 1fr auto 72px; gap: 0 8px; align-items: baseline; padding: 8px 16px; border-top: 1px solid var(--line); }
.lst__row b { font: 600 14px/20px var(--fig); }
.lst__row small { grid-column: 1; color: var(--mid); font-size: 12px; }
.lst__row .m { font: 400 12px/20px var(--fig); text-align: right; }
.lst__row.is-here { background: var(--fill); box-shadow: inset 2px 0 0 var(--text); font-weight: 600; }
.lst__row.is-here small { font-weight: 400; }
.lst__acts { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.side .placeholder { height: 112px; }
/* A sheet over the page, as Transfers' confirm; the Admin menu under its key. */
.scrim { position: absolute; inset: 0; background: rgba(5, 10, 24, 0.7); z-index: 5; }
.sheet { position: absolute; left: 448px; top: 152px; width: 544px; z-index: 7; background: var(--paper); border: 1px solid var(--line); border-top: 2px solid var(--text); padding: 24px 32px 32px; }
.sheet h2 { font: 700 20px/24px var(--head); margin-bottom: 16px; }
.sheet__x { position: absolute; right: 16px; top: 16px; width: 24px; height: 24px; text-align: center; font-size: 16px; }
.sheet label { display: block; margin: 16px 0 8px; }
.sheet__in { display: flex; justify-content: space-between; align-items: center; height: 40px; padding: 0 12px; font-size: 16px; border: 1px solid var(--mid); background: var(--bg); }
.sheet__in--code { font-family: var(--fig); letter-spacing: 1px; }
.sheet__row { display: flex; gap: 16px; justify-content: flex-end; align-items: center; margin-top: 24px; }
.sheet__row .key { min-height: 40px; padding: 0 24px; }
.sheet__done { display: flex; align-items: center; gap: 8px; padding: 16px; margin-top: 16px; border: 1px solid var(--line); }
.sheet__done b { flex: 1; font: 600 20px/24px var(--fig); letter-spacing: 1px; }
.sheet__count { margin-top: 16px; }
.menu { position: absolute; right: 441px; top: 220px; width: 220px; z-index: 4; background: var(--paper); border: 1px solid var(--text); }
.menu a { display: block; padding: 12px 16px; border-top: 1px solid var(--line); }
.menu a:first-child { border-top: 0; }
.menu a.menu__last { border-top-color: var(--mid); }
body { position: relative; }
</style>
</head>
<body>
<div id="app"></div>
<script src="render.js"></script>
</body>
</html>
