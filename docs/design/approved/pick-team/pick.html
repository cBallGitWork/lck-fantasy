<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pick Team</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap");
:root { --ink: #1d1d1d; --mid: #6b6b6b; --soft: #9a9a9a; --line: #cfcfcf; --fill: #ececec; --bg: #f7f7f5; --paper: #fff; --rise: #c8102e; --fall: #1f4fa8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1440px; background: var(--bg); color: var(--ink); font: 14px/1.4 "IBM Plex Sans KR", sans-serif; }
.num, .mono { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
a { color: var(--ink); text-decoration: none; }

/* Top bar: the same on every screen. */
nav.top { height: 56px; display: flex; align-items: stretch; gap: 32px; padding: 0 32px; background: var(--paper); border-bottom: 1px solid var(--line); }
nav.top b.word { display: flex; align-items: center; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; margin-right: 16px; }
nav.top a { display: flex; align-items: center; color: var(--mid); border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav.top a.on { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
nav.top a.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 4px; }
nav.top .sp { flex: 1; }
nav.top .presented { display: flex; align-items: center; gap: 8px; color: var(--mid); font-size: 12px; }
.ph { display: flex; align-items: center; justify-content: center; border: 1px dashed var(--soft); color: var(--mid); font-size: 12px; }

/* Parts */
.tag { display: inline-block; border: 1px solid var(--ink); padding: 0 4px; font: 400 11px/16px "IBM Plex Sans KR", sans-serif; }
.tag.prov { border-style: dashed; }
.tag.live { background: var(--ink); color: var(--paper); }
.up::before { content: "▲ "; font-size: 12px; }
.down { color: var(--mid); } .down::before { content: "▼ "; font-size: 12px; }
.cake::after { content: " 🎂"; }
.tog { display: inline-flex; font-size: 14px; }
.tog span { padding: 4px 24px; border: 1px solid var(--line); background: var(--fill); color: var(--mid); }
.tog span + span { margin-left: -1px; }
.tog span.on { background: var(--paper); color: var(--ink); font-weight: 600; }

.rise { color: var(--rise); }

/* Frame */
.page { display: grid; grid-template-columns: 1fr 360px; gap: 32px; padding: 24px 32px 48px; }
aside > section { border-top: 2px solid var(--ink); padding-top: 8px; margin-bottom: 24px; }
aside h2 { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
aside h2 span { font-weight: 400; color: var(--mid); font-size: 12px; }

/* header */
.hd { margin-bottom: 16px; }
.hd h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
.hd h1 i { font-style: normal; color: var(--mid); font-size: 16px; font-weight: 400; margin-left: 8px; letter-spacing: 0; }
.hd .dl { margin-top: 4px; } .hd .dl span { color: var(--mid); }
.hd .dl b.cd { margin-left: 12px; border: 1px solid var(--ink); padding: 0 8px; font-family: "IBM Plex Mono", monospace; }
.act { display: flex; gap: 24px; align-items: center; margin-top: 16px; padding: 8px 16px; background: var(--paper); border: 1px solid var(--ink); }
.act .chg { flex: 1; color: var(--mid); } .act .chg b { color: var(--ink); }
.act a { text-decoration: underline; }
.save { background: var(--ink); color: var(--paper); padding: 8px 24px; font-weight: 700; }
.save.off { background: var(--line); color: var(--mid); }

/* rift */
.rift { position: relative; width: 100%; height: 560px; }
.rift svg.map { position: absolute; inset: 0; width: 100%; height: 560px; }
.tile { position: absolute; width: 132px; transform: translate(-50%, -50%); text-align: center; z-index: 2; }
.tile .kit { position: relative; width: 56px; height: 50px; margin: 0 auto; }
.tile .kit svg.shirt { width: 56px; height: 50px; }
.tile .kit .code { position: absolute; left: 0; right: 0; top: 16px; font-size: 12px; font-weight: 700; }
.tile .ri { position: absolute; left: -24px; top: 0; width: 28px; height: 28px; background: var(--paper); border: 1px solid var(--ink); display: flex; align-items: center; justify-content: center; }
.tile .ri svg { width: 20px; height: 20px; }
.tile .mark { position: absolute; right: -16px; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.tile .mark.v { background: var(--paper); color: var(--ink); border: 1px solid var(--ink); }
.tile .flag { position: absolute; right: -12px; bottom: 0; width: 20px; height: 20px; background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.tile .nm { background: var(--paper); border: 1px solid var(--ink); font-weight: 700; font-size: 14px; padding: 0 4px; }
.tile .sr { background: var(--ink); color: var(--paper); font-family: "IBM Plex Mono", monospace; font-size: 12px; padding: 4px; white-space: nowrap; }
.tile .tag { margin-top: 4px; background: var(--paper); }
.tile.sel .nm, .tile.sel .sr { outline: 2px solid var(--ink); outline-offset: 1px; }
.tile.dim { opacity: .6; }
.tile.fit .nm, .tile.fit .sr { outline: 2px dashed var(--ink); outline-offset: 2px; }
.benchb { background: var(--fill); border: 1px solid var(--line); border-top: 0; padding: 16px 24px 24px; display: grid; grid-template-columns: 112px 200px 48px 200px 1fr; gap: 0 24px; align-items: start; }
.benchb h3 { font-size: 14px; }
.benchb .slot { position: relative; padding-top: 16px; }
.benchb .slot .n { position: absolute; left: 0; top: 0; font-size: 12px; color: var(--mid); }
.benchb .tile { position: relative; transform: none; left: 32px; top: 0; }
.ord { border: 1px solid var(--ink); background: var(--paper); padding: 4px 12px; font-weight: 600; }
.benchb .ord { align-self: center; justify-self: center; margin-top: 32px; }

/* cards */
.cv { margin-top: 12px; }
.lineup { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pc { background: var(--paper); border: 1px solid var(--ink); position: relative; display: flex; flex-direction: column; }
.pc .rl { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--mid); }
.pc .rl svg { width: 16px; height: 16px; }
.pc .por { height: 192px; margin: 8px; }
.pc .nm { font-size: 20px; font-weight: 700; padding: 0 8px; }
.pc .tm { font-size: 12px; color: var(--mid); padding: 0 8px 8px; }
.pc .nx { border-top: 1px solid var(--line); padding: 8px; font-size: 12px; font-family: "IBM Plex Mono", monospace; }
.pc .ft { border-top: 1px solid var(--line); display: flex; justify-content: space-between; padding: 4px 8px; font-size: 12px; color: var(--mid); font-family: "IBM Plex Mono", monospace; }
.pc .mk { position: absolute; right: 8px; top: 40px; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--paper); font-weight: 700; display: flex; align-items: center; justify-content: center; }
.pc .mk.v { background: var(--paper); color: var(--ink); border: 1px solid var(--ink); }
.pc.sel { outline: 2px solid var(--ink); }
.pc .nw { background: var(--ink); color: var(--paper); font-size: 12px; padding: 4px 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr 24px 1fr 1fr; position: relative; gap: 8px; margin-top: 8px; }
.row2 .pc .por { height: 112px; }
.row2 .sep { border-left: 1px dashed var(--soft); margin-left: 12px; }
.row2 > .ord { position: absolute; left: 748px; top: 120px; transform: translateX(-50%); z-index: 3; padding: 4px 8px; }
.pc.bench { background: var(--fill); border-color: var(--line); }

/* side */
.card { background: var(--paper); border: 1px solid var(--line); border-top: 2px solid var(--ink); margin-bottom: 24px; }
.card header { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.card header b { font-size: 20px; display: block; line-height: 1.2; } .card header .s { color: var(--mid); }
.card header .x { margin-left: auto; color: var(--mid); align-self: flex-start; }
.card .nw { background: var(--ink); color: var(--paper); padding: 8px 16px; }
.card .nx { padding: 8px 16px; border-bottom: 1px solid var(--line); }
.card .nx div { display: flex; justify-content: space-between; padding: 4px 0; } .card .nx .k { color: var(--mid); }
.card .bt { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px; }
.card .bt span { border: 1px solid var(--ink); text-align: center; padding: 8px 0; font-weight: 600; }
.card .bt span.dim { border-color: var(--line); color: var(--mid); font-weight: 400; }
.card .bt span.pressed { background: var(--fill); border-color: var(--mid); }
.buffs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.buff { border: 1px solid var(--ink); padding: 8px 12px; background: var(--paper); display: flex; justify-content: space-between; align-items: center; }
.buff b { font-size: 14px; } .buff small { color: var(--mid); font-size: 12px; display: block; }
.buff .go { border: 1px solid var(--ink); padding: 0 8px; font-size: 12px; font-weight: 600; }
.buff.on { background: var(--ink); color: var(--paper); } .buff.on small { color: var(--line); } .buff.on .go { border-color: var(--paper); }
.buff.off { border-color: var(--line); color: var(--mid); } .buff.off b { color: var(--mid); font-weight: 600; }
.buff.off a { text-decoration: underline; font-size: 12px; }
.wk div { display: grid; grid-template-columns: 32px 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--fill); align-items: center; }
.wk .d { color: var(--mid); font-size: 12px; } .wk .t { text-align: right; font-family: "IBM Plex Mono", monospace; }
.wk .t .kst { color: var(--mid); font-size: 12px; }
.ad { height: 112px; } .adline { font-size: 12px; color: var(--mid); margin-top: 8px; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-top" viewBox="0 0 16 16"><path d="M1 1h14l-3 3H4v8l-3 3z" fill="#1d1d1d"/><rect x="6" y="6" width="4" height="4" fill="#9a9a9a"/><path d="M15 6v9H6l3-3h3V9z" fill="#c4c4c4"/></symbol>
  <symbol id="i-bot" viewBox="0 0 16 16"><path d="M15 15H1l3-3h8V4l3-3z" fill="#1d1d1d"/><rect x="6" y="6" width="4" height="4" fill="#9a9a9a"/><path d="M1 10V1h9L7 4H4v3z" fill="#c4c4c4"/></symbol>
  <symbol id="i-mid" viewBox="0 0 16 16"><path d="M11 1h4v4L5 15H1v-4z" fill="#1d1d1d"/><path d="M1 1h6L4 4H4v3L1 10zM15 15H9l3-3v-3l3-3z" fill="#c4c4c4"/></symbol>
  <symbol id="i-jng" viewBox="0 0 16 16"><path d="M3 1c2 4 2 9 5 14C6 10 6 6 3 1zM8 1c1 4 1 8 1 11 1-3 2-7-1-11zM13 1c-1 3-2 6-2 9 2-2 3-6 2-9z" fill="#1d1d1d"/></symbol>
  <symbol id="i-sup" viewBox="0 0 16 16"><path d="M8 3l2 2-2 9-2-9zM1 4h5l1 2-2 2zM15 4h-5l-1 2 2 2zM6 2l2-1 2 1-2 1z" fill="#1d1d1d"/></symbol>
  <symbol id="i-coach" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" fill="none" stroke="#1d1d1d" stroke-width="1.6"/><path d="M5 7h6M5 10h4" stroke="#1d1d1d" stroke-width="1.4"/></symbol>
  <symbol id="shirt" viewBox="0 0 56 50"><path d="M18 2 L8 6 L1 16 L9 22 L12 19 L12 48 L44 48 L44 19 L47 22 L55 16 L48 6 L38 2 Q28 9 18 2 Z" fill="#fff" stroke="#1d1d1d" stroke-width="1.6"/><path d="M18 2 Q28 9 38 2" fill="none" stroke="#1d1d1d" stroke-width="1.6"/></symbol>
</defs></svg>

<nav class="top"><b class="word">Flol</b><a>Home</a><a class="on">Pick Team</a><a>Transfers</a><a>Points</a><a>Leagues</a><a>Stats</a><a>LCK</a><a class="live">Live</a><span class="sp"></span>
  <span class="presented">presented by <span class="ph" style="width:120px;height:24px">Sponsor</span></span></nav>
<div class="page">
<main>
  <div class="hd"><div><h1>Pick Team<i>팀 선택</i></h1>
      <div class="dl">LCK Cup Week 4 · Deadline <b>Wed 07:45</b> your time <span>· 16:45 KST</span><b class="cd">9h 45m</b></div></div></div>
  <div class="ctl"><span class="tog" id="tog"></span></div>
  <div id="board"></div>
  <div class="act" id="act"></div>
</main>
<aside>
  <section class="card" id="card"></section>
  <section><h2>Buffs</h2><div class="buffs" id="buffs"></div></section>
  <section><h2>This week's series <span>your time · KST</span></h2><div class="wk" id="week"></div></section>
  <div class="ad ph">Sponsor</div><div class="adline">All sponsors are made up.</div>
</aside>
</div>
<script>
// Made-up LCK Cup Week 4 for the Pick Team wireframes. Every number is an example.
// Tuesday 22:00 London (Wed 07:00 KST), the same moment as the Transfers picture: Kiin → Zeus confirmed,
// the Kingen buy still unconfirmed there, so Siwoo is still the saved Flex.
// Deadline Wed 16:45 KST = 07:45 London in January (15 min before the first series, spec/10).
// ?v=rift (default) | cards | swap
const V = new URLSearchParams(location.search).get("v") || "rift";
const W4 = [
  ["Wed","08:00","17:00","HLE","DK"],["Wed","10:30","19:30","T1","KT"],
  ["Thu","08:00","17:00","GEN","BRO"],["Thu","10:30","19:30","NS","DNS"],
  ["Fri","08:00","17:00","KRX","BFX"],["Fri","10:30","19:30","DK","KT"],
  ["Sat","08:00","17:00","T1","GEN"],["Sat","10:30","19:30","HLE","NS"],
  ["Sun","08:00","17:00","BRO","BFX"],["Sun","10:30","19:30","KRX","DNS"],
];
const SQ = [
  { slot: "top", name: "Zeus", team: "HLE", price: "16.0", form: "14.0" },
  { slot: "jng", name: "Canyon", team: "GEN", price: "15.5", form: "14.7" },
  { slot: "mid", name: "Faker", team: "T1", price: "18.5", form: "19.3", mark: "C" },
  { slot: "bot", name: "Ruler", team: "GEN", price: "17.0", form: "15.3", mark: "V" },
  { slot: "sup", name: "Delight", team: "HLE", price: "9.0", form: "9.3" },
  { slot: "flex", role: "top", name: "Siwoo", team: "DK", price: "7.5", form: "7.7", news: "Not starting Wed" },
  { slot: "coach", name: "kkOma", team: "T1", price: "7.0", form: "9.0" },
  { slot: "b1", role: "mid", name: "Bdd", team: "KT", price: "5.0", form: "5.3" },
  { slot: "b2", role: "jng", name: "Cuzz", team: "KT", price: "4.0", form: "7.7" },
];
const ICON = { top: "i-top", jng: "i-jng", mid: "i-mid", bot: "i-bot", sup: "i-sup", coach: "i-coach" };
const NAME = { top: "Top", jng: "Jungle", mid: "Mid", bot: "Bot", sup: "Support", flex: "Flex", coach: "Coach", b1: "Bench 1", b2: "Bench 2" };
const by = (s) => SQ.find((p) => p.slot === s);
const games = (t) => W4.filter((s) => s[3] === t || s[4] === t).map((s) => ({ opp: s[3] === t ? s[4] : s[3], day: s[0], time: s[1] }));
const $ = (id) => document.getElementById(id);
const SWAP = V === "swap";
const SEL = SWAP ? "Siwoo" : "Faker";
const FIT = SWAP ? new Set(["Bdd", "Cuzz"]) : new Set(); // the Flex takes any role (spec/01)

// header
$("act").innerHTML = SWAP
  ? `<span class="chg"><b>1 change</b> · Bench Boost on</span><a>Reset</a><span class="save">Save team</span>`
  : `<span class="chg">No changes</span><span class="save off">Save team</span>`;
$("tog").innerHTML = V === "cards" ? `<span>Rift view</span><span class="on">Card view</span>` : `<span class="on">Rift view</span><span>Card view</span>`;

// rift view
function tile(p) {
  const cls = p.name === SEL ? "sel" : FIT.has(p.name) ? "fit" : SWAP ? "dim" : "";
  const g = games(p.team).map((x) => `vs ${x.opp}`).join(", ");
  const sub = p.slot === "flex" ? `<div class="tag">Flex · plays Top</div>` : p.slot === "coach" ? `<div class="tag">Coach 감독</div>` : "";
  return `<div class="tile ${cls}"><div class="kit"><svg class="shirt"><use href="#shirt"/></svg><span class="code">${p.team}</span>
    <span class="ri"><svg><use href="#${ICON[p.role || p.slot]}"/></svg></span>${p.mark ? `<span class="mark ${p.mark === "V" ? "v" : ""}">${p.mark}</span>` : ""}${p.news ? `<span class="flag">!</span>` : ""}</div>
    <div class="nm">${p.name}</div><div class="sr">${g}</div>${sub}</div>`;
}
const POS = { top: [104, 70], jng: [312, 262], mid: [532, 262], coach: [124, 468], flex: [282, 468], sup: [682, 486], bot: [878, 486] };
const MAP = `<svg class="map" viewBox="0 0 680 680" preserveAspectRatio="none">
  <rect width="680" height="680" fill="#ededeb"/><path d="M0 40 L40 0 L680 640 L640 680 Z" fill="#dcdcd8"/>
  <path d="M60 640 L60 60 L640 60" fill="none" stroke="#fff" stroke-width="44" stroke-linejoin="round"/>
  <path d="M40 620 L620 620 L620 40" fill="none" stroke="#fff" stroke-width="44" stroke-linejoin="round"/>
  <path d="M60 620 L620 60" fill="none" stroke="#fff" stroke-width="40"/>
  <path d="M0 520 A160 160 0 0 1 160 680 L0 680 Z" fill="#c9c9c9"/><path d="M520 0 A160 160 0 0 0 680 160 L680 0 Z" fill="#c9c9c9"/>
  <g fill="#9a9a9a"><rect x="54" y="400" width="12" height="12"/><rect x="54" y="220" width="12" height="12"/><rect x="250" y="54" width="12" height="12"/><rect x="430" y="54" width="12" height="12"/>
  <rect x="270" y="614" width="12" height="12"/><rect x="450" y="614" width="12" height="12"/><rect x="614" y="440" width="12" height="12"/><rect x="614" y="260" width="12" height="12"/>
  <rect x="250" y="424" width="12" height="12"/><rect x="420" y="254" width="12" height="12"/></g>
  <circle cx="200" cy="200" r="16" fill="none" stroke="#9a9a9a" stroke-dasharray="3 3"/><circle cx="480" cy="480" r="16" fill="none" stroke="#9a9a9a" stroke-dasharray="3 3"/></svg>`;
function rift() {
  const starters = ["top","jng","mid","bot","sup","flex","coach"].map((s) => {
    const w = document.createElement("div"); w.innerHTML = tile(by(s)); const t = w.firstElementChild;
    t.style.left = POS[s][0] + "px"; t.style.top = POS[s][1] + "px"; return t.outerHTML; }).join("");
  const [b1, b2] = ["b1","b2"].map((s) => { const p = by(s); return `<div class="slot"><span class="n">${s[1]} · ${NAME[p.role]}</span>${tile(p)}</div>`; });
  const bench = b1 + `<span class="ord">⇅</span>` + b2;
  return `<div class="rift">${MAP}${starters}</div><div class="benchb"><h3>Bench</h3>${bench}</div>`;
}

// card view
function pc(p, cls = "") {
  const role = p.slot === "flex" ? `Flex · plays ${NAME[p.role]}` : /^b\d/.test(p.slot) ? `${NAME[p.slot]} · ${NAME[p.role]}` : NAME[p.slot];
  const nx = games(p.team).map((x) => `vs ${x.opp}`).join(", ");
  return `<div class="pc ${cls} ${p.name === SEL ? "sel" : ""}"><div class="rl"><span>${role}</span><svg><use href="#${ICON[p.role || p.slot]}"/></svg></div>${p.mark ? `<span class="mk ${p.mark === "V" ? "v" : ""}">${p.mark}</span>` : ""}
    ${p.news ? `<div class="nw">! ${p.news}</div>` : ""}<div class="por ph">${p.slot === "coach" ? "Crest" : "Photo"}</div><div class="nm">${p.name}</div><div class="tm">${p.team}</div>
    <div class="nx">${nx}</div><div class="ft"><span>Form ${p.form}</span><span>${p.price}억</span></div></div>`;
}
function cards() {
  return `<div class="cv"><div class="lineup">${["top","jng","mid","bot","sup"].map((s) => pc(by(s))).join("")}</div>
    <div class="row2"><div>${pc(by("flex"))}</div><div>${pc(by("coach"))}</div><div class="sep"></div><div>${pc(by("b1"), "bench")}</div><div>${pc(by("b2"), "bench")}</div><span class="ord">⇅</span></div>
    </div>`;
}
$("board").innerHTML = V === "cards" ? cards() : rift();

// the tapped player's card (spec/12, The player card)
const nx = (p) => games(p.team).map((x) => `<div><span class="k">${x.day} ${x.time}</span><span>vs ${x.opp} · Bo3</span></div>`).join("");
const row = (k, v) => `<div><span class="k">${k}</span><span>${v}</span></div>`;
$("card").innerHTML = SWAP
  ? `<header><svg width="40" height="36"><use href="#shirt"/></svg><div><b>Siwoo</b><span class="s">DK · Flex · plays Top · 7.5억</span></div><span class="x">✕</span></header>
     <div class="nw">! Not starting Wed</div>
     <div class="nx">${row("Form", "<b class=num>7.7</b> · 7th of 10 tops")}${row("Owned", "<b class=num>6%</b> · 9th")}${row("Season", "<b class=num>23</b> · 8th")}</div>
     <div class="nx">${row("Last 3 weeks", "<span class=num>6 · 9 · 8</span>")}</div><div class="nx">${nx(by("flex"))}</div>
     <div class="bt"><span class="dim">Make Carry</span><span class="dim">Make Vice-carry</span><span>Cancel swap</span><span class="dim">Full card ›</span></div>`
