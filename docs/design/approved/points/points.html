<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Points</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../pick-team/base.css">
<link rel="stylesheet" href="../pick-team/look.css">
<style>
/* Points in Pick Team's look: the Rift at the main column's left with the week's points on each tile, a column of panels
   beside it (the week's total, the bench), the tapped player's week under both; leagues, the week's series and your
   week in the side column. Only what is Points' own is here; the rest is ../pick-team/look.css. */
:root { --head-band: #1D46A8; --up: #4CD98A; --down: #FF6B78; }
.num { text-align: right; }
.live { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--signal); }
.tag--dash { border-style: dashed; }
.team__bar { display: inline-block; width: 4px; height: 12px; margin-right: 6px; vertical-align: -1px; }
.shield { margin-right: 6px; vertical-align: -2px; }
.ws .tag { margin-right: 8px; }
.ws__v { margin: 0 4px; }

/* The week beside the title: ‹ and › are keys, off at the first and the latest week. */
.weeknav { display: inline-flex; align-items: center; gap: 8px; }
.weeknav__key { width: 32px; min-height: 32px; padding: 0; border-color: var(--mid); }
.weeknav__key:disabled { color: var(--mid); border-color: var(--line); }

/* A tile's band: the week's points, then each series' opponent and points. */
.ptile__pts { font: 400 12px/24px var(--sans); }
.ptile__pts b { font: 700 16px/24px var(--fig); }
.ptile__next { color: #B9C2DC; }
.ptile__split { color: #B9C2DC; white-space: nowrap; border-top: 1px solid #1B2440; }
.ptile__split .dot { margin-left: 3px; vertical-align: 1px; }
/* A bench player's points don't count: grey. */
.tile.ptile--bench .ptile__pts b, .tile.ptile--bench .ptile__split { color: var(--mid); }

/* The column's panels: a title on the blue band (plate.md, Parts, Panel), contents 16 in. */
.tpanel { padding: 12px 16px; border-top: 0 !important; }
.tpanel__title { font: 700 16px/24px var(--head); margin: -12px -16px 8px; padding: 12px 16px 8px; background: var(--head-band); }
.squad-foot .bench { border-top: 0; grid-template-rows: auto auto; align-content: start; align-items: start; padding-top: 0; }
.squad-foot .bench__title { justify-self: stretch; margin: 0 -16px 4px; padding: 12px 16px 8px; background: var(--head-band); }
.total__big { display: flex; align-items: center; gap: 12px; padding: 4px 0 8px; }
.total__big b { font: 700 28px/32px var(--fig); }
.figs > div { display: flex; justify-content: space-between; align-items: center; min-height: var(--row); border-top: 1px solid var(--line); }
.figs dt { color: var(--mid); }
.figs dd { font-weight: 600; }
.total__live { display: flex; align-items: center; gap: 8px; min-height: var(--row); border-top: 1px solid var(--line); }
.total__live .link { margin-left: auto; }
.picks .pick { display: grid; grid-template-columns: 88px 1fr 96px; align-items: center; min-height: var(--row); border-top: 1px solid var(--line); }
.picks .pick--head { min-height: 20px; border-top: 0; }
.pick dt { color: var(--mid); }
.pick dd { display: flex; align-items: center; gap: 6px; }
.pick dd .team__bar { margin-right: 0; }
.fact { display: flex; align-items: center; gap: 8px; }
.ico { flex: none; }
.ico--star { color: var(--gold); }
.ico--flop { color: var(--down); }
.ico--killer { color: var(--text); }
.who__team { font-weight: 400; }
.pick__figs { justify-content: space-between; }
.pick__figs > :first-child { width: 32px; text-align: right; }
.yours { width: 8px; height: 8px; border-radius: 50%; background: var(--text); }

/* The tapped player's week, under the Rift: the final card of the card round (27 Nov 2026). */
.bd { background: var(--paper); border: 1px solid var(--line); }
.bd__head { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 16px; background: var(--head-band); }
.bd__head .crest { width: 32px; height: 32px; }
.bd__head .card__name { font: 700 20px/24px var(--head); }
.bd__team { font-weight: 400; }
.bd__team .team__bar { width: 6px; height: 16px; margin-right: 6px; vertical-align: -1px; }
.bd__role { background: var(--band); font: 700 12px/20px var(--sans); padding: 0 8px; }
.bd__ko { font: 400 14px/24px var(--sans); opacity: 0.85; }
.bd__c { position: static; width: 24px; height: 24px; font: 700 14px/20px var(--sans); box-shadow: none; text-align: center; }
.bd__total { display: flex; align-items: baseline; gap: 12px; margin-left: auto; }
.bd__total b { font: 700 28px/32px var(--fig); }
.bd table { width: 100%; }
.bd th { font: 400 12px/28px var(--sans); color: var(--mid); text-align: right; padding: 0 16px 0 0; white-space: nowrap; }
.bd th:first-child, .bd td:first-child { text-align: left; padding-left: 16px; }
.bd th.l { text-align: left; }
.bd td { height: 32px; border-top: 1px solid var(--line); text-align: right; padding: 0 16px 0 0; white-space: nowrap; }
.bd td.l { text-align: left; }
.bd td.k { width: 48px; }
.bd td:first-child { width: 280px; }
.bd td.d { color: var(--mid); }
.bd tr.ser td { background: var(--fill); font-weight: 600; }
.bd .mini { width: 20px; height: 20px; vertical-align: -5px; margin-right: 4px; }
.chip { display: inline-block; min-width: 24px; height: 24px; padding: 0 6px; font: 600 12px/22px var(--fig); text-align: center; border: 1px solid transparent; }
.chip--w { color: var(--up); border-color: var(--up); }
.chip--l { color: var(--down); border-color: var(--down); }
.chip--live { background: var(--text); color: var(--bg); }
.bd__pts { display: inline-block; min-width: 24px; line-height: 22px; text-align: center; border: 1px solid var(--text); }
.is-dropped .bd__pts { border-color: transparent; color: var(--mid); font-weight: 400; }
.bd__foot { display: flex; justify-content: flex-end; padding: 8px 16px; border-top: 1px solid var(--line); }
@media (min-width: 601px) { .main { position: sticky; top: 16px; align-self: start; } }

/* The side column's panels. */
.side-panel { background: var(--paper); border: 1px solid var(--line); padding-bottom: 0; }
.side-panel--pad { padding-bottom: 4px; }
.side-panel table { margin: 0 -16px; width: calc(100% + 32px); }
.side-panel td { height: var(--row); border-top: 1px solid var(--line); white-space: nowrap; }
.side-panel tr:first-child td { border-top: 0; }
.side-panel td:first-child { padding-left: 16px; }
.side-panel td:last-child { padding-right: 16px; }
.lg td:last-child { width: 88px; }
.up { color: var(--up); }
.down { color: var(--down); }
.lg__foot { display: flex; justify-content: space-between; align-items: center; min-height: var(--row); margin: 0 -16px; padding: 0 16px; border-top: 1px solid var(--line); }
.ws td:first-child { width: 56px; }
.ws b { font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../pick-team/data.js"></script>
<script src="../pick-team/map.js"></script>
<script src="render.js"></script>
</body>
</html>
