<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Team shirts B</title><style>
:root{--bg:#010A13;--paper:#0A1428;--line:#1E2D40;--ink:#C89B3C;--text:#F0E6D2;--mid:#A09B8C}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1440px;background:var(--bg);color:var(--text);font:14px/1.4 "Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:24px 32px 40px}
h1{font-size:28px;font-weight:700}h1 i{font-style:normal;color:var(--mid);font-size:16px;font-weight:400;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:20px}
.card{background:var(--paper);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.sizes{display:flex;align-items:end;gap:16px}
.code{font-weight:700;font-size:16px;letter-spacing:.04em}
.line{color:var(--mid);font-size:13px;text-align:center;min-height:36px}
.strip{display:flex;gap:12px;align-items:center;margin-top:24px;padding:12px 16px;border-top:2px solid var(--ink)}
.strip span{color:var(--mid);font-size:12px;margin-right:8px}
.note{color:var(--mid);font-size:12px;margin-top:6px}
</style></head><body>
<h1>Team shirts <i>designer B · kit as the joke</i></h1>
