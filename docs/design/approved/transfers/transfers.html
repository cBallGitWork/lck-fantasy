<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../pick-team/base.css">
<link rel="stylesheet" href="../pick-team/look.css">
<style>
/* Transfers in Pick Team's look: the Rift at the main column's left, a column of panels beside it the Rift's height,
   the player list in the side column. Only what is Transfers' own is here; the rest is ../pick-team/look.css. */
.team { display: inline-flex; align-items: center; gap: 4px; color: var(--mid); font-weight: 400; }
.team__bar { display: inline-block; width: 4px; height: 0.75em; }
.num { text-align: right; }

/* The nine on the Rift by role: a role's players side by side under its name, said once. */
.group { display: flex; flex-direction: column; align-items: center; gap: 0.6cqw; }
.group__role { background: var(--band); color: var(--on-band); font: 700 12px/20px var(--sans); padding: 0 8px; }
.group__tiles { display: flex; gap: 1cqw; }
/* The strip over the shirt: × to sell at its left, the price in its middle. */
.ttile__top { display: flex; align-items: center; justify-content: center; padding: 0 0 0 24px; line-height: 24px; font-weight: 600; }
.ttile__x { position: absolute; left: 0; top: 0; width: 24px; height: 24px; color: var(--on-band); font: 400 16px/24px var(--sans); }
/* Bought and not yet confirmed: the selected outline. */
.tile.is-new { outline: 2px solid var(--select); outline-offset: 2px; }
/* A sold player's slot. */
.tile--empty .tile__card { width: 100%; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0; background: rgba(5, 10, 24, 0.7); border: 1px dashed var(--text); border-bottom: 0; color: var(--text); }
.empty__plus { font: 400 28px/32px var(--sans); }
.tile--empty .tile__plate { width: 100%; background: var(--band); color: var(--on-band); border: 1px dashed var(--text); border-top: 0; font-weight: 600; line-height: 42px; }

/* The column's panels: the page's one panel (look.css gives the box); titles 16/700, contents 16 in. */
.tpanel { padding: 12px 16px; }
.tpanel__title { font: 700 16px/24px var(--head); padding-bottom: 8px; }
.tpanel--yours { flex: 1; display: flex; flex-direction: column; }
.figs > div { display: flex; justify-content: space-between; align-items: center; min-height: var(--row); border-top: 1px solid var(--line); }
.figs dt { color: var(--mid); }
.figs dd { font-weight: 600; }
.draft { flex: 1; border-top: 1px solid var(--line); padding-top: 4px; }
.draft__row { display: flex; justify-content: space-between; align-items: center; min-height: var(--row); }
.draft__row s { color: var(--mid); }
.off { text-align: right; }
.tpanel__keys { display: flex; align-items: center; gap: 16px; padding-top: 8px; }
.tpanel__keys .save { flex: 1; }
.conf { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; border-top: 1px solid var(--line); }
.conf > div { display: flex; flex-direction: column; }
.conf .key { min-height: 32px; }
/* What the last + did, in the list's panel where it was pressed. */
.note { margin-bottom: 8px; padding: 4px 8px; background: var(--fill); border-left: 2px solid var(--text); }

/* The player list, a panel in the side column. */
.plist { background: var(--paper); border: 1px solid var(--line); border-top: 2px solid var(--text); padding-bottom: 0; }
/* Tabs: plain words, the chosen one underlined (plate.md, Tabs). */
.chips { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
.chip { font-size: 12px; line-height: 28px; color: var(--mid); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.chip.is-here { color: var(--text); font-weight: 600; border-bottom-color: var(--text); }
.plist__find { display: flex; gap: 4px; padding: 12px 0; }
.field { display: inline-flex; align-items: center; min-height: 32px; padding: 0 8px; border: 1px solid var(--line); color: var(--mid); font-size: 12px; white-space: nowrap; }
.plist__find .field:first-child { flex: 1; }
.field--pick { color: var(--text); }
.plist table, .slist table { margin: 0 -16px; width: calc(100% + 32px); }
.plist td, .plist th, .slist td, .slist th { height: var(--row); padding: 0 4px; border-top: 1px solid var(--line); white-space: nowrap; text-align: left; }
.plist .num, .slist .num { text-align: right; }
.plist td:first-child, .plist th:first-child, .slist td:first-child, .slist th:first-child { padding-left: 16px; }
.plist td:last-child, .plist th:last-child, .slist td:last-child, .slist th:last-child { padding-right: 16px; }
.plist__role th, .slist__role th { font: 400 12px/1 var(--sans); color: var(--mid); background: var(--fill); height: 32px; }
.plist__role th:first-child, .slist__role th:first-child { font: 700 14px/1 var(--sans); color: var(--text); }
.plist__who { display: flex; align-items: center; gap: 8px; }
/* The list's columns: fixed widths with even gaps, figures right-aligned under right-aligned heads, words left (plate.md, Table). */
.page { grid-template-columns: minmax(0, 1fr) 424px; }
.plist table { table-layout: fixed; }
.plist th:nth-child(2), .plist td:nth-child(2) { width: 68px; }
.plist th:nth-child(3), .plist td:nth-child(3) { width: 40px; }
.plist th:nth-child(4), .plist td:nth-child(4) { width: 50px; }
.plist th:nth-child(5), .plist td:nth-child(5) { width: 92px; padding-left: 16px; }
.plist th:nth-child(6), .plist td:nth-child(6) { width: 40px; }
.plist__role th[colspan] { width: auto; }
.act { width: 28px; text-align: right; }
.rowkey { width: 24px; height: 24px; border: 1px solid var(--text); font: 600 14px/22px var(--sans); }

/* List view: the squad as a table in the Rift's place. */
.slist { flex: 1 1 auto; min-width: 0; background: var(--paper); border: 1px solid var(--line); border-top: 2px solid var(--text); padding: 0 16px; align-self: flex-start; }
.slist__who { display: flex; align-items: center; gap: 8px; }
.slist__shirt { width: 28px; height: 28px; }
.slist tr.is-new td:first-child { box-shadow: inset 2px 0 0 var(--select); }
.object--list .squad-foot { margin-block: 0; }

/* The tapped player's card, docked under the Rift: who he is and his one key, his stats with their rank, his series.
   The Rift, its panels and the card stay in view as the long list scrolls. */
.pcard { background: var(--paper); border: 1px solid var(--line); }
.pcard__head { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 16px; background: var(--head-band, var(--fill)); }
.pcard__head .crest { width: 32px; height: 32px; }
.pcard__head .card__name { font: 700 20px/24px var(--head); }
.pcard__team { font-weight: 400; }
.pcard__team .team__bar { width: 6px; height: 16px; margin-right: 6px; vertical-align: -1px; }
.pcard__role { background: var(--band); font: 700 12px/20px var(--sans); padding: 0 8px; }
.pcard__total { display: flex; align-items: baseline; gap: 12px; margin-left: auto; }
.pcard__total b { font: 700 28px/32px var(--fig); }
.pcard__strip { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line); }
.pcard__strip > div { display: flex; flex-direction: column; padding: 8px 12px 8px 16px; white-space: nowrap; }
.pcard__strip > div + div { border-left: 1px solid var(--line); }
.pcard__strip b { font: 600 20px/28px var(--fig); }
.pcard__foot { display: flex; align-items: center; gap: 24px; padding: 8px 16px; }
.pcard__run { display: flex; align-items: center; gap: 4px; }
.pcard__run > .small { margin-right: 8px; }
.sc { display: flex; flex-direction: column; align-items: center; width: 56px; padding: 4px 0; background: var(--fill); font-size: 12px; line-height: 16px; }
.sc b { font: 600 14px/20px var(--fig); }
.mini { width: 24px; height: 24px; }
.pcard__keys { display: flex; align-items: center; gap: 16px; margin-left: auto; }
.pcard__keys .key { min-height: 40px; min-width: 120px; font-weight: 700; color: var(--bg); border: 0; }
.pcard__sell { background: var(--rise); }
.pcard__buy { background: var(--add, var(--text)); }
.plist tr.is-tapped td { background: var(--fill); }
.plist tr.is-tapped td:first-child { box-shadow: inset 2px 0 0 var(--select); }
@media (min-width: 601px) { .main { position: sticky; top: 16px; align-self: start; } }

/* The confirm sheet: a heavy frame so it stands off the page. */
.scrim { position: fixed; inset: 0; background: rgba(5, 10, 24, 0.7); }
.sheet { position: fixed; left: 50%; top: 160px; transform: translateX(-50%); width: 560px; background: var(--paper); border: 2px solid var(--text); padding: 16px 24px 24px; }
.sheet__close { position: absolute; top: 16px; right: 16px; }
.sheet__title { font: 700 20px/32px var(--head); padding-bottom: 8px; }
.sheet__moves th { text-align: left; font: 400 12px/24px var(--sans); color: var(--mid); }
.sheet__moves td { height: 48px; border-top: 1px solid var(--line); }
.sheet__moves td > * { margin-right: 8px; }
.sheet__arrow { width: 40px; color: var(--mid); }
.sheet__keys { display: flex; align-items: center; gap: 16px; padding-top: 16px; }
.sheet__keys .deadline { flex: 1; }
.sheet__keys .key { min-height: 40px; font-size: 14px; }

/* The colour round's one recipe (Craig, 26 Nov 2026; plate.md, Colour): a brighter blue band on panel titles, green and
   red on what a transfer changes (the bank and cost chips, × to sell, + to buy, the bought player's outline), a 6px team
   bar in the lists. Gold stays the one main key's; role names stay plain; no kit strip on the tiles; no teal. */
.c-u { --head-band: #1D46A8; --add: #4CD98A; }
.c-u .tpanel { border-top: 0; }
.c-u .tpanel__title { margin: -12px -16px 8px; padding: 12px 16px 8px; background: var(--head-band); }
.c-u .slist { border-top: 2px solid var(--head-band); }
.c-u .bank, .c-u .cost.is-hit { padding: 2px 8px; color: var(--bg); }
.c-u .bank.is-ok { background: var(--add); }
.c-u .bank.is-over, .c-u .cost.is-hit { background: var(--rise); }
.c-u .ttile__x { background: var(--rise); color: var(--bg); font-weight: 700; }
.c-u .rowkey--sell { background: var(--rise); border-color: var(--rise); color: var(--bg); }
.c-u .rowkey:not(.rowkey--sell) { background: var(--add); border-color: var(--add); color: var(--bg); }
.c-u .tile.is-new { outline-color: var(--add); }
.c-u .slist tr.is-new td:first-child { box-shadow: inset 2px 0 0 var(--add); }
.c-u .team__bar { width: 6px; height: 0.9em; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../pick-team/data.js"></script>
<script src="../pick-team/map.js"></script>
<script src="render.js"></script>
</body>
</html>
