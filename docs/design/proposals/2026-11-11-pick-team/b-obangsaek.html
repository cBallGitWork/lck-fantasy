<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Look B · Five colours</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a team sheet. The squad is one row of tall role cards, each in its obangsaek colour; the player list sits under it full width. */
:root{--paper:#f3f5f4;--card:#ffffff;--ink:#16191d;--dim:#6a7178;--line:#d5dad8;
  --top:#1f4fa8;--jng:#2d7a54;--mid:#c9302c;--bot:#d99a11;--sup:#16191d;--flex:#7b5ea7;--coach:#8a8f94;
  --display:"Hanken Grotesk","Noto Sans KR",sans-serif;--ko:"Gowun Batang","Noto Sans KR",serif}
*{box-sizing:border-box}body{margin:0;width:1440px;min-height:900px;background:var(--paper);color:var(--ink);font:14px/1.4 var(--display)}
header{display:flex;align-items:center;gap:40px;padding:0 48px;height:64px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font:800 19px var(--display);display:flex;gap:9px;align-items:center}.logo i{font:700 20px var(--ko);font-style:normal;color:var(--mid)}
nav{display:flex;gap:28px;font-weight:600;color:var(--dim)}nav .on{color:var(--ink)}
.save{margin-left:auto;background:var(--ink);color:#fff;border:0;font:700 14px var(--display);padding:11px 22px;border-radius:999px}
.top{display:grid;grid-template-columns:1fr auto;align-items:end;padding:30px 48px 18px}
.top h1{font:800 44px/1 var(--display);letter-spacing:-.03em;margin:0}.top h1 i{font:400 30px var(--ko);font-style:normal;color:var(--dim);margin-left:14px}
.top p{margin:8px 0 0;color:var(--dim);font-size:15px}.top p b{color:var(--ink)}
.money{display:flex;gap:34px;text-align:right}.money div span{display:block;color:var(--dim);font-size:12px}.money div b{font:800 28px var(--display);font-variant-numeric:tabular-nums}.money .bank b{color:var(--jng)}
.sheet{display:grid;grid-template-columns:repeat(9,1fr);gap:10px;padding:0 48px}
.slot{position:relative;background:var(--card);border-radius:10px;padding:54px 12px 14px;min-height:190px;display:grid;align-content:end;gap:2px;overflow:hidden;border:1px solid var(--line)}
.slot label{position:absolute;inset:0 0 auto 0;height:44px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;color:#fff;font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--coach)}
.slot label i{font:700 17px var(--ko);font-style:normal;letter-spacing:0}
.s-top label{background:var(--top)}.s-jng label{background:var(--jng)}.s-mid label{background:var(--mid)}.s-bot label{background:var(--bot)}.s-sup label{background:var(--sup)}.s-flex label{background:var(--flex)}
.s-bench{background:transparent;border-style:dashed}.s-bench label{background:none;color:var(--dim);border-bottom:1px dashed var(--line)}
.slot b{font:800 21px/1.1 var(--display);letter-spacing:-.02em}.slot .t{font-weight:700;font-size:13px}.slot .nx{color:var(--dim);font-size:12px}.slot .pr{font-weight:700;font-variant-numeric:tabular-nums;margin-top:8px}
.slot .empty{font-size:15px;color:var(--dim)}
.mark{position:absolute;left:12px;top:56px;font:800 11px var(--display);font-style:normal;border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px}
.i7{margin-left:14px}
.list{margin:26px 48px 40px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px}
.tabs{display:flex;gap:6px;margin-bottom:8px;align-items:center}.tabs h2{font:800 18px var(--display);margin:0 18px 0 0}.tabs span{padding:6px 14px;border-radius:999px;color:var(--dim);font-weight:600;font-size:13px}.tabs .on{background:var(--ink);color:#fff}
.cols{columns:2;column-gap:40px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r span{display:none}td.r i{font:700 14px var(--ko);font-style:normal;color:#fff;background:var(--coach);border-radius:4px;padding:2px 7px}
td.r-top i{background:var(--top)!important}td.r-jng i{background:var(--jng)!important}td.r-mid i{background:var(--mid)!important}td.r-bot i{background:var(--bot)!important}td.r-sup i{background:var(--sup)!important}
td.n b{font-weight:700;font-size:15px}td.n span{color:var(--dim);margin-left:8px;font-size:12px;font-weight:600}td.f,td.o{color:var(--dim);font-size:13px}td.o,td.p{text-align:right}td.p{font-weight:700}
td.a{text-align:right}td.a button{background:none;border:1.5px solid var(--ink);border-radius:999px;padding:3px 13px;font:700 12px var(--display)}
tr.in td.n b{color:var(--dim)}tr.in button{border-color:var(--line);color:var(--dim)}
</style></head><body>
<header><div class="logo"><i>엘씨케이</i>LCK Fantasy</div>
<nav><span class="on">Pick team</span><span>Points</span><span>Transfers</span><span>Leagues</span><span>Fixtures</span><span>The Book</span></nav>
<button class="save">Save team</button></header>
<div class="top"><div><h1>Pick your team<i>팀 구성</i></h1><p>LCK Cup, week 1. Deadline <b>Wed 13 Jan, 07:30</b> your time. No account needed until you save.</p></div>
<div class="money"><div><span>Budget</span><b data-budget></b></div><div><span>Spent</span><b data-spent></b></div><div class="bank"><span>In the bank</span><b data-bank></b></div></div></div>
<div class="sheet" data-slots></div>
<div class="list"><div class="tabs"><h2>Players</h2><span class="on">All</span><span>Top</span><span>Jungle</span><span>Mid</span><span>Bot</span><span>Support</span><span>Coach</span></div>
<div class="cols"><table><tbody data-rows></tbody></table></div></div>
<script src="shared.js"></script></body></html>
