<!doctype html><html lang="en"><head><meta charset="utf-8"><title>LCK hub</title><style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap");
:root { --ink: #1d1d1d; --mid: #6b6b6b; --soft: #9a9a9a; --line: #cfcfcf; --fill: #ececec; --bg: #f7f7f5; --paper: #fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
/* type scale: 28 page title · 20 figures and team codes · 14 body · 12 labels (the nav is shared) */
body { width: 1440px; background: var(--bg); color: var(--ink); font: 14px/1.4 "IBM Plex Sans KR", sans-serif; }
.mono { font-family: "IBM Plex Mono", monospace; }
nav.top { height: 56px; display: flex; align-items: center; gap: 28px; padding: 0 32px; background: var(--paper); border-bottom: 1px solid var(--line); }
nav.top b.word { font-size: 20px; letter-spacing: -0.5px; margin-right: 12px; }
nav.top a { color: var(--mid); }
nav.top a.on { color: var(--ink); font-weight: 700; border-bottom: 2px solid var(--ink); padding-bottom: 16px; margin-bottom: -18px; }
nav.top .sp { flex: 1; }
.presented { color: var(--soft); font-size: 12px; display: flex; gap: 8px; align-items: center; }
.ph { background: repeating-linear-gradient(45deg, var(--fill), var(--fill) 6px, #e2e2e2 6px, #e2e2e2 12px); border: 1px dashed var(--soft); color: var(--mid); display: flex; align-items: center; justify-content: center; font-size: 12px; }

.page { padding: 24px 32px 48px; }
.head { display: flex; align-items: baseline; gap: 14px; }
.head h1 { font-size: 28px; letter-spacing: -.5px; } .head h1 i { font-style: normal; font-weight: 500; color: var(--mid); margin-left: 10px; }
.tabs { display: flex; gap: 0; margin: 18px 0 0; border-bottom: 2px solid var(--ink); }
.tabs span { padding: 10px 22px; font-weight: 600; color: var(--mid); } .tabs span.on { background: var(--ink); color: #fff; }
.stages { display: flex; border-bottom: 1px solid var(--line); margin: 6px 0 24px; }
.stages span { padding: 10px 0; margin-right: 28px; color: var(--mid); } .stages span.on { color: var(--ink); font-weight: 700; border-bottom: 2px solid var(--ink); margin-bottom: -1px; }

h2 { font-size: 14px; font-weight: 700; border-top: 2px solid var(--ink); padding-top: 10px; margin-bottom: 8px; display: flex; align-items: baseline; gap: 12px; }
h2 .sp { flex: 1; } h2 small { font-size: 12px; font-weight: 400; color: var(--mid); }
.wrap { display: grid; grid-template-columns: 1fr 340px; gap: 32px; margin-top: 4px; }

/* fixtures: one gameweek, by day; blue side left, red right, as the broadcast */
.gw { display: flex; align-items: center; gap: 10px; font-weight: 700; } .gw span { border: 1px solid var(--line); background: var(--paper); padding: 2px 9px; color: var(--mid); font-weight: 400; }
.day { display: grid; grid-template-columns: 90px 1fr; border-top: 1px solid var(--line); }
.day > b { padding: 14px 0; font-size: 14px; } .day > b small { display: block; color: var(--mid); font-weight: 400; font-size: 12px; }
.sr { display: grid; grid-template-columns: 64px 64px 110px 36px 110px 1fr 20px; align-items: center; height: 48px; border-bottom: 1px solid var(--fill); background: var(--paper); padding: 0 14px; }
.sr:last-child { border-bottom: 0; }
.sr .t { font-family: "IBM Plex Mono", monospace; } .sr .k { font-family: "IBM Plex Mono", monospace; color: var(--mid); }
.cols { display: grid; grid-template-columns: 90px 64px 64px; padding: 0 0 4px; font-size: 12px; color: var(--mid); } .cols span:first-child { grid-column: 2; padding-left: 14px; }
.sr .a { text-align: right; } .sr .a b, .sr .b b { font: 600 20px "IBM Plex Mono", monospace; } .sr .a small, .sr .b small { font-size: 12px; color: var(--mid); margin: 0 8px; }
.sr .v { text-align: center; color: var(--mid); }
.sr .f { text-align: right; color: var(--mid); }
.sr.mine { box-shadow: inset 3px 0 0 var(--ink); }
.sr.rs { grid-template-columns: 0 0 140px 80px 140px 1fr 20px; } .sr .sc { text-align: center; font: 600 20px "IBM Plex Mono", monospace; } .sr b.lo { color: var(--mid); font-weight: 400; }

/* news: Sheep Esports' LCK headlines, each a plain link out */
.news { padding-top: 0; } .news a { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--fill); color: var(--ink); text-decoration: none; }
.news a .ph { height: 64px; font-size: 12px; } .news a.more { display: inline-block; }
.news a b { font-weight: 500; display: block; } .news a small { color: var(--mid); font-size: 12px; }
.more { display: inline-block; margin-top: 10px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* standings: the two groups side by side */
.groups { display: grid; grid-template-columns: 1fr; gap: 32px; }
.groups td.tm { width: 230px; } .groups td.n, .groups th { width: 72px; } .groups td.fm { width: 160px; }
table { width: 100%; border-collapse: collapse; background: var(--paper); }
th { text-align: right; font-size: 12px; font-weight: 500; color: var(--mid); padding: 8px 14px 6px; } th.l { text-align: left; }
td { text-align: right; padding: 0 14px; height: 44px; border-top: 1px solid var(--fill); } td.l { text-align: left; }
td.n { font-family: "IBM Plex Mono", monospace; } td.rk { width: 40px; color: var(--mid); font-family: "IBM Plex Mono", monospace; text-align: left; }
td.tm b { font: 600 20px "IBM Plex Mono", monospace; margin-right: 8px; } td.tm small { color: var(--mid); font-size: 12px; }
td.fm span { display: inline-block; width: 14px; font: 600 14px "IBM Plex Mono", monospace; text-align: center; }
td.fm span.w { color: var(--ink); } td.fm span.l { color: var(--soft); font-weight: 400; }

/* Teams tab: a team picker, then name plates in role order, coach set apart */
.pick { display: flex; gap: 6px; margin: 18px 0 24px; } .pick span { border: 1px solid var(--line); background: var(--paper); padding: 6px 14px; font: 600 14px "IBM Plex Mono", monospace; color: var(--mid); } .pick span.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.plates { display: grid; grid-template-columns: repeat(5, 1fr) 16px 1fr; gap: 10px; }
.plates .pp:nth-child(6) { grid-column: 7; }
.pp { background: var(--paper); border-top: 3px solid var(--ink); padding: 14px 16px 16px; }
.pp .rl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mid); margin-bottom: 10px; } .pp .rl svg { width: 13px; height: 13px; }
.pp b { display: block; font-size: 20px; font-weight: 700; } .pp small { color: var(--mid); font-size: 12px; }
.pp .ph { height: 120px; margin-bottom: 10px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
table.rt td { height: 48px; } table.rt td.rl { width: 110px; color: var(--mid); font-size: 12px; } table.rt td.rl svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 6px; }
table.rt b { font-size: 14px; font-weight: 600; } table.rt small { color: var(--mid); font-size: 12px; margin-left: 4px; } table.rt td.na { color: var(--soft); }
table.rt tr.co td { border-top: 1px solid var(--line); }
/* rosters: one row a team, role order, coach last */
.ros { margin-top: 36px; }
.ros td { text-align: left; height: 54px; } .ros td.tm { width: 190px; }
.ros td small { display: block; color: var(--mid); font-size: 12px; line-height: 1.2; }
.ros td.pl { line-height: 1.2; }
.ros th { text-align: left; } .ros th:last-child, .ros td:last-child { border-left: 1px solid var(--line); } .ros th svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 5px; }
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-top" viewBox="0 0 16 16"><path d="M1 1h14l-3 3H4v8l-3 3z" fill="#1d1d1d"/><rect x="6" y="6" width="4" height="4" fill="#9a9a9a"/><path d="M15 6v9H6l3-3h3V9z" fill="#c4c4c4"/></symbol>
  <symbol id="i-bot" viewBox="0 0 16 16"><path d="M15 15H1l3-3h8V4l3-3z" fill="#1d1d1d"/><rect x="6" y="6" width="4" height="4" fill="#9a9a9a"/><path d="M1 10V1h9L7 4H4v3z" fill="#c4c4c4"/></symbol>
  <symbol id="i-mid" viewBox="0 0 16 16"><path d="M11 1h4v4L5 15H1v-4z" fill="#1d1d1d"/><path d="M1 1h6L4 4H4v3L1 10zM15 15H9l3-3v-3l3-3z" fill="#c4c4c4"/></symbol>
  <symbol id="i-jng" viewBox="0 0 16 16"><path d="M3 1c2 4 2 9 5 14C6 10 6 6 3 1zM8 1c1 4 1 8 1 11 1-3 2-7-1-11zM13 1c-1 3-2 6-2 9 2-2 3-6 2-9z" fill="#1d1d1d"/></symbol>
  <symbol id="i-sup" viewBox="0 0 16 16"><path d="M8 3l2 2-2 9-2-9zM1 4h5l1 2-2 2zM15 4h-5l-1 2 2 2zM6 2l2-1 2 1-2 1z" fill="#1d1d1d"/></symbol>
  <symbol id="i-coach" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" fill="none" stroke="#1d1d1d" stroke-width="1.6"/><path d="M5 7h6M5 10h4" stroke="#1d1d1d" stroke-width="1.4"/></symbol>
</defs></svg>
<nav class="top"><b class="word">Flol</b><a>Home</a><a>Pick Team</a><a>Transfers</a><a>Points</a><a>Leagues</a><a>Stats</a><a class="on">LCK</a><a>Live</a><span class="sp"></span><span class="presented">presented by <span class="ph" style="width:120px;height:26px">sponsor</span></span></nav>
<div class="page">
  <div class="head"><h1>LCK Cup 2027<i>LCK 컵</i></h1><span style="flex:1"></span><span>Week 4 deadline <b>Wed 07:45</b></span></div>
  <div class="tabs" id="tabs"></div>
  <div class="stages" id="stages"><span class="on">Groups</span><span>Play-In</span><span>Playoffs</span></div>
  <div class="wrap"><div><section id="fx"></section><section id="res"></section><div class="groups" id="groups"></div><div id="teams"></div></div>
    <aside class="news" id="news"></aside></div>
</div>
<script>
// Made-up LCK Cup data, the same moment as the Pick Team and Transfers pictures: Week 4, Tuesday 22:00 London.
// Week 4's series are Pick Team's; records are after Week 3 and agree with T1's on the player card (5–1, sets 11–4).
// Groups, stages and their names are data per competition (spec/10); every Week 4 series is cross-group. Rosters: 2026's, a placeholder.
const $ = (id) => document.getElementById(id);
const REC = { T1: [5, 1, 7], DK: [3, 3, 1], KRX: [3, 3, -1], NS: [2, 4, -3], BRO: [1, 5, -7],
  GEN: [5, 1, 6], HLE: [4, 2, 3], DNS: [3, 3, 0], KT: [3, 3, -1], BFX: [1, 5, -5] };
const rec = (t) => `${REC[t][0]}–${REC[t][1]}`;

// Fixtures: one gameweek, by day; your time and KST (spec/12: the LCK hub holds the fixtures).
const W4 = [["Wed", "20 Jan", [["08:00", "17:00", "HLE", "DK"], ["10:30", "19:30", "T1", "KT"]]],
  ["Thu", "21 Jan", [["08:00", "17:00", "GEN", "BRO"], ["10:30", "19:30", "NS", "DNS"]]],
  ["Fri", "22 Jan", [["08:00", "17:00", "KRX", "BFX"], ["10:30", "19:30", "DK", "KT"]]],
  ["Sat", "23 Jan", [["08:00", "17:00", "T1", "GEN"], ["10:30", "19:30", "HLE", "NS"]]],
  ["Sun", "24 Jan", [["08:00", "17:00", "BRO", "BFX"], ["10:30", "19:30", "KRX", "DNS"]]]];
$("fx").innerHTML = `<h2><span class="gw"><span>‹</span>Week 4<span>›</span></span><small>20–24 Jan · Bo3</small></h2><div class="cols"><span>Yours</span><span>KST</span></div>`
  + W4.map(([d, dt, ss]) => `<div class="day"><b>${d}<small>${dt}</small></b><div>${ss.map(([t, k, a, b]) =>
    `<div class="sr"><span class="t">${t}</span><span class="k">${k}</span><span class="a"><small>${rec(a)}</small><b>${a}</b></span><span class="v">v</span><span class="b"><b>${b}</b><small>${rec(b)}</small></span><span></span><span class="f">›</span></div>`).join("")}</div></div>`).join("");

// Results: one gameweek's series with their scores; Week 3, as the Points picture (Sun's two made up).
const W3 = [["Wed", "13 Jan", [["T1", 2, 1, "HLE"], ["GEN", 2, 0, "KT"]]], ["Thu", "14 Jan", [["DK", 2, 0, "NS"], ["BRO", 1, 2, "DNS"]]],
  ["Fri", "15 Jan", [["KT", 2, 1, "BFX"], ["NS", 0, 2, "KRX"]]], ["Sat", "16 Jan", [["GEN", 2, 1, "HLE"], ["T1", 2, 0, "DK"]]],
  ["Sun", "17 Jan", [["KRX", 2, 1, "BRO"], ["BFX", 0, 2, "DNS"]]]];
$("res").innerHTML = `<h2><span class="gw"><span>‹</span>Week 3<span>›</span></span><small>13–17 Jan · Bo3</small></h2>`
  + W3.map(([d, dt, ss]) => `<div class="day"><b>${d}<small>${dt}</small></b><div>${ss.map(([a, sa, sb, b]) =>
    `<div class="sr rs"><span></span><span></span><span class="a"><b class="${sa > sb ? "" : "lo"}">${a}</b></span><span class="sc">${sa}–${sb}</span><span class="b"><b class="${sb > sa ? "" : "lo"}">${b}</b></span><span></span><span class="f">›</span></div>`).join("")}</div></div>`).join("");

// News: Sheep Esports' LCK articles, headlines only, each a link out (Craig, 14 Nov 2026). Headlines are made up.
const NEWS = [["T1 win five in a row after their opening loss to GEN", "Mon 18 Jan"], ["Kiin: \"We know where we lost the GEN series\"", "Mon 18 Jan"],
  ["BNK FEARX bench their jungler for Week 4", "Sun 17 Jan"], ["DK's Siwoo leads every top laner in solo kills", "Sun 17 Jan"], ["Week 4 preview: T1 v GEN on Saturday", "Fri 15 Jan"]];
$("news").innerHTML = `<h2>News<span class="sp"></span><small>Sheep Esports</small></h2>`
  + NEWS.map(([h, d]) => `<a><span class="ph">thumbnail</span><span><b>${h}</b><small>${d} ↗</small></span></a>`).join("") + `<a class="more" style="border:0;display:inline-block">More on Sheep Esports ↗</a>`;

// Standings: each group's rank, series won and lost, set difference, last 5 (spec/12: standings).
const FORM = { T1: "WWWWW", GEN: "LWWWW", HLE: "WWWLL", DK: "WLWWL", KT: "LWLLW", DNS: "LWLWW", NS: "WWLLL", KRX: "LWLWW", BRO: "WLLLL", BFX: "LWLLL" };
const NAME = { T1: "T1", GEN: "Gen.G", DNS: "DN SOOPers", NS: "Nongshim RedForce", BRO: "HANJIN BRION", HLE: "Hanwha Life", DK: "Dplus KIA", KT: "KT Rolster", KRX: "Kiwoom DRX", BFX: "BNK FEARX" };
// Last 5 runs oldest to newest and ends with Week 3's two results.
// Full table: series won and lost, sets won and lost, set difference, win rate, last 5. Sets add to each team's +/−.
const SETS = { T1: [11, 4], DK: [8, 7], KRX: [7, 8], NS: [5, 8], BRO: [4, 11], GEN: [11, 5], HLE: [9, 6], DNS: [8, 8], KT: [7, 8], BFX: [4, 9] };
const G = (title, ko, teams) => `<section><h2>${title}<small>${ko}</small></h2><table><tr><th class="l"></th><th class="l">Team</th><th>W</th><th>L</th><th>Sets W</th><th>Sets L</th><th>+/−</th><th>Win %</th><th>Last 5</th></tr>`
  + teams.map((t, i) => `<tr><td class="rk">${i + 1}</td><td class="l tm"><b>${t}</b><small>${NAME[t]}</small></td><td class="n">${REC[t][0]}</td><td class="n">${REC[t][1]}</td><td class="n">${SETS[t][0]}</td><td class="n">${SETS[t][1]}</td><td class="n">${REC[t][2] > 0 ? "+" : ""}${REC[t][2]}</td><td class="n">${Math.round(REC[t][0] / 6 * 100)}%</td><td class="fm">${[...FORM[t]].map((r) => `<span class="${r.toLowerCase()}">${r}</span>`).join("")}</td></tr>`).join("") + `</table></section>`;
$("groups").innerHTML = G("Baron group", "바론 그룹", ["T1", "DK", "KRX", "NS", "BRO"]) + G("Elder group", "장로 그룹", ["GEN", "HLE", "DNS", "KT", "BFX"]);

// Rosters: one row a team, Top to Support then Coach, game name over real name (spec/12: rosters).
const RO = [["T1", ["Doran", "최현준"], ["Oner", "문현준"], ["Faker", "이상혁"], ["Peyz", "김수환"], ["Keria", "류민석"], ["kkOma", "김정균"]],
  ["GEN", ["Kiin", "김기인"], ["Canyon", "김건부"], ["Chovy", "정지훈"], ["Ruler", "박재혁"], ["Duro", "주민규"], ["Ryu", "류상욱"]],
  ["HLE", ["Zeus", "최우제"], ["Kanavi", "서진혁"], ["Zeka", "김건우"], ["Gumayusi", "이민형"], ["Delight", "유환중"], ["Homme", "윤성영"]],
  ["DK", ["Siwoo", "전시우"], ["Lucid", "최용혁"], ["ShowMaker", "허수"], ["Aiming", "김하람"], ["BeryL", "조건희"], ["cvMax", "김대호"]],
  ["KT", ["PerfecT", "이승민"], ["Cuzz", "문우찬"], ["Bdd", "곽보성"], ["deokdam", "서대길"], ["Peter", "정윤수"], ["Score", "고동빈"]],
  ["DNS", ["DuDu", "이동주"], ["Pyosik", "홍창현"], ["BuLLDoG", "이태영"], ["Berserker", "김민철"], ["Life", "김정민"], ["Ssong", "송경호"]],
  ["NS", ["Kingen", "황성훈"], ["Sponge", "배영준"], ["Scout", "이예찬"], ["Taeyoon", "김태윤"], ["Lehends", "손시우"], ["DanDy", "최인규"]],
  ["KRX", ["Rich", "이재원"], ["Willer", "김정현"], ["ucal", "손우현"], ["Hype", "변정현"], ["Andil", "문관빈"], ["Joker", "조재읍"]],
  ["BRO", ["Casting", "신민제"], ["GIDEON", "김민성"], ["Clozer", "이주현"], ["Teddy", "박진성"], ["Pollu", "오동규"], ["Edgar", "최승민"]],
  ["BFX", ["Clear", "송현민"], ["Raptor", "전어진"], ["VicLa", "이대광"], ["Diable", "남대근"], ["Kellin", "김형규"], ["Mowgli", "이재하"]]];
const V = new URLSearchParams(location.search).get("v") || "fixtures";
const TABS = [["fixtures", "Fixtures"], ["results", "Results"], ["standings", "Standings"], ["teams", "Teams"]];
$("tabs").innerHTML = TABS.map(([k, t]) => `<span class="${k === V ? "on" : ""}">${t}</span>`).join("");
const SHOW = { fixtures: "fx", results: "res", standings: "groups", teams: "teams" };
Object.values(SHOW).forEach((id) => { if (id !== SHOW[V]) $(id).style.display = "none"; });
if (V === "teams") $("stages").style.display = "none";
const RH = [["i-top", "Top"], ["i-jng", "Jungle"], ["i-mid", "Mid"], ["i-bot", "Bot"], ["i-sup", "Support"], ["i-coach", "Coach"]];
// Teams tab: one team at a time; its LCK roster, then its academy roster in LCK CL, whose players are in the game too
// (Craig, 15 Nov 2026). Role order Top to Support, coach last. Academy names are made up.
const ACAD = { T1: ["T1 Esports Academy", [["Haru", "김하루"], ["Sejin", "박세진"], ["Dowon", "이도원"], ["Minjae", "최민재"], ["Yunho", "정윤호"], ["Tom", "임재현"]]] };
const plate = (ic, role, [g, k]) => `<div class="pp"><span class="rl"><svg><use href="#${ic}"/></svg>${role}</span><b>${g}</b><small>${k}</small></div>`;
const t1 = RO.find(([t]) => t === "T1");
// Prices: the LCK roster's from the coach card's Roster tab; the coach is the team's slot at 7.0억. Academy prices are not set yet.
// Academy players are in the pool like FPL reserves (Craig, 15 Nov 2026), at cheap-pick prices. No academy coach: the coach is the team (Craig, 15 Nov 2026).
const ACPR = ["5.0억", "5.0억", "5.5억", "5.0억", "5.0억"];
const PR = ["12.5억", "14.0억", "18.5억", "15.0억", "14.5억", "7.0억"];
const ros = (title, lg, ps, pr) => `<section><h2>${title}<small>${lg}</small></h2><table class="rt">${ps.map(([g, k], i) =>
  `<tr class="${i === 5 ? "co" : ""}"><td class="l rl"><svg><use href="#${RH[i][0]}"/></svg>${RH[i][1]}</td><td class="l"><b>${g}</b> <small>${k}</small></td><td class="n ${pr && pr[i] !== "–" ? "" : "na"}">${pr ? pr[i] : "–"}</td></tr>`).join("")}</table></section>`;
$("teams").innerHTML = `<div class="pick">${RO.map(([t]) => `<span class="${t === "T1" ? "on" : ""}">${t}</span>`).join("")}</div>
  <div class="two">${ros("T1", "LCK", t1.slice(1), PR)}${ros(ACAD.T1[0], "LCK CL", ACAD.T1[1].slice(0, 5), ACPR)}</div>`;
</script></body></html>
