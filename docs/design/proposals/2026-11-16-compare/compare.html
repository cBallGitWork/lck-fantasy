<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Compare</title>
<style>@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap");
:root { --ink: #1d1d1d; --mid: #6b6b6b; --soft: #9a9a9a; --line: #cfcfcf; --fill: #ececec; --bg: #f7f7f5; --paper: #fff; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1440px; min-height: 1000px; background: var(--bg); color: var(--ink); font: 14px/1.4 "IBM Plex Sans KR", sans-serif; position: relative; }
iframe.under { position: absolute; inset: 0; width: 1440px; height: 1000px; border: 0; }
.dim { position: absolute; inset: 0; background: rgba(29,29,29,.55); }
.ph { background: repeating-linear-gradient(45deg, var(--fill), var(--fill) 6px, #e2e2e2 6px, #e2e2e2 12px); border: 1px dashed var(--soft); color: var(--mid); display: flex; align-items: center; justify-content: center; font-size: 11px; }
.mono { font-family: "IBM Plex Mono", monospace; }

/* type scale, as the player card: 32 names · 20 mono figures · 14 body · 12 labels */
.sheet { position: absolute; left: 220px; top: 32px; width: 1000px; background: var(--paper); border: 1px solid var(--ink); }
.x { position: absolute; right: 18px; top: 10px; font-size: 16px; color: var(--mid); }
.bar { display: flex; align-items: baseline; gap: 12px; padding: 14px 24px 0; } .bar b { font-size: 14px; } .bar span { font-size: 12px; color: var(--mid); }

/* the two lower-thirds, facing each other as the broadcast's head-to-head */
.vs { display: grid; grid-template-columns: 1fr 72px 1fr; align-items: end; padding: 18px 24px 18px; border-bottom: 1px solid var(--line); }
.lt { display: flex; gap: 16px; align-items: flex-end; } .lt.r { flex-direction: row-reverse; text-align: right; }
.por { width: 72px; height: 72px; flex: none; }
.chip { display: inline-block; background: var(--ink); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; margin-bottom: 6px; }
.lt h1 { font-size: 32px; letter-spacing: -1px; line-height: 1; display: flex; align-items: baseline; gap: 10px; } .lt.r h1 { justify-content: flex-end; }
.lt h1 i { font-style: normal; font-weight: 500; color: var(--mid); letter-spacing: 0; }
.lt .legal { font-size: 12px; color: var(--mid); margin-top: 6px; } .lt .legal a { color: var(--ink); font-weight: 600; text-decoration: underline; margin-left: 10px; }
.vs .v { text-align: center; font: 600 20px "IBM Plex Mono", monospace; color: var(--mid); padding-bottom: 18px; }

/* one mirrored table: Faker's side, the line in the middle, Chovy's side */
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.wrap { padding: 0 24px 24px; }
h4 { font-size: 12px; font-weight: 600; border-top: 2px solid var(--ink); padding-top: 8px; margin: 22px 0 4px; display: flex; justify-content: space-between; } h4 span { font-weight: 400; color: var(--mid); }
th { font-size: 12px; font-weight: 500; color: var(--mid); padding: 0 8px 6px; }
td { height: 38px; padding: 0 8px; border-top: 1px solid var(--fill); font: 14px "IBM Plex Mono", monospace; color: var(--mid); }
td.lab { text-align: center; font: 500 13px "IBM Plex Sans KR"; color: var(--ink); background: var(--bg); }
.L { text-align: right; } .R { text-align: left; }
td.b { color: var(--ink); font-weight: 600; }
td.pts { font-size: 14px; }
td.pts.b { font-size: 14px; }
td small { font: 12px "IBM Plex Sans KR"; color: var(--mid); margin: 0 6px; }
tr.big td { height: 52px; } tr.big td.b, tr.big td { font-size: 20px; }
/* series strips, as the card's front */
.strip { display: flex; gap: 0; } .L .strip { justify-content: flex-end; }
.strip span { display: inline-flex; flex-direction: column; min-width: 74px; padding: 0 6px; text-align: center; font: 12px "IBM Plex Sans KR"; color: var(--mid); }
.strip span b { font: 600 20px "IBM Plex Mono", monospace; color: var(--ink); line-height: 1.2; }
.strip span em { font: 600 14px "IBM Plex Sans KR"; color: var(--ink); font-style: normal; line-height: 1.6; }
.strip span.first em { text-decoration: underline; text-underline-offset: 3px; }
tr.str td { height: 64px; }
.up { font-size: 12px; }
</style></head>
<body>
<iframe class="under" src="../../approved/player-card/card.html"></iframe><div class="dim"></div>
<div class="sheet">
  <span class="x">✕</span>
  <div class="bar"><b>Compare</b></div>
  <div class="vs">
    <div class="lt"><div class="por ph">portrait</div><div><span class="chip">Mid · T1</span><h1>Faker<i>이상혁</i></h1><div class="legal">Lee Sang-hyeok</div></div></div>
    <div class="v">v</div>
    <div class="lt r"><div class="por ph">portrait</div><div><span class="chip">Mid · GEN</span><h1>Chovy<i>정지훈</i></h1><div class="legal">Jeong Ji-hoon<a>Change</a></div></div></div>
  </div>
  <div class="wrap" id="wrap"></div>
</div>
<script>
// Opened from Compare › on Faker's card, from Pick Team: LCK Cup Week 4, Tuesday 22:00 London, Weeks 1 to 3 final.
// Faker's numbers are the card's; Chovy's are the Stats and Transfers pictures'. Form is points ÷ 3 until Week 4 is final,
// so Chovy's 61 gives 20.3 (1st) and Faker's 58 gives 19.3 (2nd).
// [label, Faker, Chovy, which side is better: "L", "R" or "" (not compared), shown big]
const HEAD = [
  ["Points", "58<small>2nd</small>", "61<small>1st</small>", "R", true],
  ["Form", "19.3<small>2nd</small>", "20.3<small>1st</small>", "R"],
  ["Price", "18.5억 <span class=up>▲0.5</span>", "17.5억 <span class=up>▲0.5</span>", ""],
  ["Owned", "46%<small>1st</small>", "41%<small>2nd</small>", ""],
  ["This week", "+1,204 / −310", "+980 / −402", ""],
];
// The last 3 series with points, then the next 3, the first underlined (spec/12 Front). GEN W3: v KT 2–0, v HLE 2–1 (Series picture: 8).
const LAST = { F: [["W2 · Fri", "BFX", 10], ["W3 · Wed", "HLE", 12], ["W3 · Sat", "DK", 5]], C: [["W2 · Sat", "BRO", 11], ["W3 · Wed", "KT", 9], ["W3 · Sat", "HLE", 8]] };
const NEXT = { F: [["W4 · Wed", "KT"], ["W4 · Sat", "GEN"], ["W5 · Thu", "BRO"]], C: [["W4 · Thu", "BRO"], ["W4 · Sat", "T1"], ["W5 · Wed", "DNS"]] };
// Season lines (spec/05): [line, Faker total, Faker pts, Chovy total, Chovy pts, lower is better]. Faker 15 games, Chovy 16.
const GF = 15, GC = 16;
const LINES = [["Kills", 74, 22, 70, 24], ["Assists", 87, 16, 74, 12], ["Deaths", 25, -4, 9, -2, true], ["Gold lead at 15", 9, 9, 11, 11],
  ["Solo kills", 5, 5, 8, 8], ["First bloods", 3, 3, 3, 3], ["Deathless", 4, 4, 4, 4], ["Quadra kills", 1, 1, 1, 1], ["Steals", 2, 2, 0, 0]];
const sum = (i) => LINES.reduce((s, x) => s + x[i], 0); // 58 and 61, the season points

const col5 = `<colgroup><col><col style="width:200px"><col></colgroup>`;
const row = ([lab, f, c, better, big]) => `<tr class="${big ? "big" : ""}"><td class="L ${better === "L" ? "b" : ""}">${f}</td><td class="lab">${lab}</td><td class="R ${better === "R" ? "b" : ""}">${c}</td></tr>`;
const strip = (xs, past) => `<div class="strip">${xs.map(([w, o, p], i) => `<span class="${!past && i === 0 ? "first" : ""}">${w}${past ? `<b>${p}</b>v ${o}` : `<em>v ${o}</em>Bo3`}</span>`).join("")}</div>`;
const head = `<table style="margin-top:4px">${col5}${HEAD.map(row).join("")}
  <tr class="str"><td class="L">${strip(LAST.F, true)}</td><td class="lab">Last 3</td><td class="R">${strip(LAST.C, true)}</td></tr>
  <tr class="str"><td class="L">${strip(NEXT.F)}</td><td class="lab">Next 3</td><td class="R">${strip(NEXT.C)}</td></tr></table>`;

// Each side: total, per game, points; mirrored so the points sit next to the line. The better points are marked.
const pg = (t, g) => (t / g).toFixed(1);
const sgn = (p) => (p > 0 ? "+" + p : p);
const lineRow = ([l, ft, fp, ct, cp, low]) => { const b = fp === cp ? "" : fp > cp ? "L" : "R";
  return `<tr><td class="L">${ft}</td><td class="L">${pg(ft, GF)}</td><td class="L pts ${b === "L" ? "b" : ""}">${sgn(fp)}</td><td class="lab">${l}</td>
    <td class="R pts ${b === "R" ? "b" : ""}">${sgn(cp)}</td><td class="R">${pg(ct, GC)}</td><td class="R">${ct}</td></tr>`; };
const lines = `<h4>Season <span>Faker ${GF} games · Chovy ${GC} games</span></h4><table>
  <colgroup><col><col style="width:110px"><col style="width:90px"><col style="width:200px"><col style="width:90px"><col style="width:110px"><col></colgroup>
  <tr><th class="L">Total</th><th class="L">Per game</th><th class="L">Pts</th><th></th><th class="R">Pts</th><th class="R">Per game</th><th class="R">Total</th></tr>
  ${LINES.map(lineRow).join("")}</table>`;

document.getElementById("wrap").innerHTML = head + lines;
console.assert(sum(2) === 58 && sum(4) === 61, "season points");
</script>
</body></html>
