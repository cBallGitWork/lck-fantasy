<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick Team: Broadcast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="base.css">
<style>
/* 2. Broadcast: a neutral black ground, navy only in the lower thirds, a condensed scoreboard face,
   the hangul at 44 beside a 28 title, the Rift at 720. */
:root {
  --bg: #111214; --paper: #191A1D; --line: #2B2D31; --fill: #24262A; --soft: #55585E;
  --text: #F1F0EC; --mid: #9A9CA1; --rise: #FF5C6C; --signal: #2BD4C4;
  --navy: #16326B; --gold: #D9A441; --on-gold: #111214; --wordmark: #D9A441;
  --sans: "Barlow", "Pretendard Variable", sans-serif; --head: "Barlow Semi Condensed", "Pretendard Variable", sans-serif;
  --fig: "Barlow", sans-serif; --ko: "Pretendard Variable", sans-serif;
  --row: 40px; --rift: 940px; --tile-w: 140px; --tile-w-phone: 78px; --tile-card-h: 124px;
  --tile-card: rgba(241, 240, 236, 0.5); --plate: #FFFFFF; --on-plate: #111214; --band: #16326B; --on-band: #F1F0EC;
  --shirt: #F1F0EC; --shirt-line: #111214; --shirt-text: #111214; --tile-label: #F1F0EC;
  --c-bg: #D9A441; --c-text: #111214; --flag-bg: #F1F0EC; --flag-text: #111214; --select: #F1F0EC;
}
.top { background: #0B0C0D; }
.head { align-items: flex-end; }
.title { display: flex; align-items: flex-end; gap: 12px; }
.title__en { font-size: 28px; line-height: 1; padding-bottom: 4px; }
.title__ko { font: 800 44px/1 var(--ko); letter-spacing: -0.03em; }
.head__week { padding-bottom: 4px; }
.buffs { gap: 8px; }
.buff { background: var(--paper); border-left: 4px solid var(--gold); padding: 8px 12px; }
.buff__name { font: 700 16px/1.2 var(--head); }
.tile__plate { font: 700 14px/24px var(--head); }
.bench { background: var(--paper); border: 0; border-top: 1px solid var(--line); }
.bar { background: #0B0C0D; border: 0; border-top: 2px solid var(--navy); }
.card { border-top: 0; }
.card__head { background: var(--paper); border-top: 2px solid var(--gold); padding: 12px 16px; }
.card__name { font: 700 28px/1 var(--head); }
.card__meta { color: var(--mid); }
.card__close { color: var(--mid); }
.card__rows > div { border-top-color: var(--line); }
.side__title { font: 700 16px/1.3 var(--head); border-top: 0; border-bottom: 2px solid var(--navy); }
@media (max-width: 600px) {
  .title__ko { font-size: 32px; }
  .title__en { font-size: 22px; padding-bottom: 2px; }
  .object { margin: 0 -16px; }
  .views { margin-left: 16px; }
  .bench { margin: 0; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="map.js"></script>
<script src="render.js"></script>
</body>
</html>
